<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Library | BlazeX</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .hidden-el { display: none !important; }

        /* Premium matte glass effect - No glows */
        .glass-header {
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .slider-track {
            padding-left: 1rem;
            padding-right: 1rem;
            scroll-padding-left: 1rem;
        }
        @media (min-width: 768px) {
            .slider-track { padding-left: 1.5rem; padding-right: 1.5rem; scroll-padding-left: 1.5rem; }
        }

        /* --- Fullscreen List View Overlay Transition --- */
        .list-overlay-enter { animation: listOverlayFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .list-overlay-exit { animation: listOverlayFadeOut 0.3s ease-in forwards; }
        @keyframes listOverlayFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes listOverlayFadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(20px); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24 relative">

    <!-- Premium Sticky Header -->
    <header class="sticky top-0 z-40 glass-header w-full px-4 py-4">
        <div class="max-w-4xl mx-auto flex flex-col gap-4">
            
            <div class="flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#F47521]" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" />
                </svg>
                <h1 class="text-xl md:text-2xl font-black text-white uppercase tracking-widest">
                    Library
                </h1>
            </div>
            
            <div class="relative w-full">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                <input type="text" id="library-search" placeholder="Search your saved anime..." class="w-full bg-[#111] border border-white/5 rounded-xl py-3 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-[#F47521]/50 transition-colors shadow-inner" oninput="handleSearch()">
                <button id="clear-search-btn" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white hidden transition-colors" onclick="clearSearch()">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-5xl mx-auto pt-6 relative z-10 w-full overflow-hidden">
        
        <!-- Loading State -->
        <div id="loading-state" class="flex flex-col items-center justify-center py-24">
            <i class="fas fa-circle-notch fa-spin text-4xl text-[#F47521] mb-4"></i>
            <p class="text-gray-500 font-bold tracking-widest uppercase text-sm">Syncing Library Data...</p>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden-el flex flex-col items-center justify-center py-20 px-4 text-center">
            <div class="w-20 h-20 bg-[#111] rounded-full flex items-center justify-center border border-white/5 mb-4 shadow-lg">
                <i class="fas fa-bookmark text-3xl text-gray-600"></i>
            </div>
            <h2 class="text-xl font-black text-white mb-2">Your Library is Empty</h2>
            <p class="text-gray-400 text-sm max-w-xs leading-relaxed">You haven't saved any anime yet. Start exploring and bookmark your favorites!</p>
            <button onclick="window.location.href='/index.html'" class="mt-6 bg-[#F47521] hover:bg-[#d96216] text-white px-6 py-2.5 rounded-xl font-bold transition-all shadow-[0_4px_15px_rgba(244,117,33,0.2)]">
                Explore Anime
            </button>
        </div>

        <!-- Default Categorized View -->
        <div id="library-sliders-view" class="hidden-el pb-4">
            <!-- 1. Top Dynamic Categories (Recent, Airing, Completed, Movies, etc.) -->
            <div id="top-sliders-mount"></div>
            <!-- 2. Genre Rectangle Tiles -->
            <div id="genre-tiles-mount"></div>
            <!-- 3. Genre Sliders -->
            <div id="genre-sliders-mount" class="mt-4"></div>
        </div>

        <!-- Search Results Grid (List View Format) -->
        <div id="library-search-view" class="hidden-el px-4 md:px-6 pb-4 pt-4">
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4 border-b border-white/5 pb-2" id="search-results-count">Results (0)</h3>
            <div id="search-grid-mount" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4 mt-6">
                <!-- Search results injected here -->
            </div>
        </div>

    </main>

    <!-- Genre List Fullscreen Overlay (For clicking genre tiles) -->
    <div id="genre-list-overlay" class="fixed inset-0 z-50 bg-[#050505] hidden-el flex flex-col pointer-events-auto">
        <header class="glass-header w-full px-4 py-4 flex items-center gap-4 border-b border-white/5">
            <button onclick="closeGenreList()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-white transition-colors border border-white/5">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 id="genre-list-title" class="text-xl font-black text-white uppercase tracking-widest">Genre</h1>
        </header>
        <div class="flex-1 overflow-y-auto px-4 md:px-6 py-6 hide-scrollbar">
            <div id="genre-list-mount" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
                <!-- Genre items injected here -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div id="bottomnav-container" class="fixed bottom-0 w-full z-[45]"></div>
    <script src="/bottomnav.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChgVcbDPzc6AMeoac1hCOx39YK_1mEKvU",
            authDomain: "blaze-x-db2f5.firebaseapp.com",
            projectId: "blaze-x-db2f5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Global State
        let enrichedLibraryItems = [];
        let groupedGenres = {};
        
        // Exact API used by info.html
        const baseUrl = 'https://anikoto-api-xi.vercel.app'; 

        // --- NAVIGATION & UTILITY --- //
        window.sliderNavigate = (id) => window.location.href = `/info.html?id=${id}`;

        window.scrollTrack = (trackId, direction) => {
            const track = document.getElementById(trackId);
            if (track) {
                const scrollAmount = window.innerWidth > 768 ? 600 : 300;
                track.scrollBy({ left: scrollAmount * direction, behavior: 'smooth' });
            }
        };

        window.scrollToGenre = (trackId) => {
            const el = document.getElementById(`container-${trackId}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        };

        // --- REMOVE FROM LIBRARY (DB + DOM Cleanup) --- //
        window.removeFromLibrary = async (event, idStr) => {
            event.stopPropagation();
            if (!auth.currentUser) return;
            try {
                // Remove from DB
                await deleteDoc(doc(db, "users", auth.currentUser.uid, "library", String(idStr)));
                
                // Remove all DOM elements associated with this anime ID (both sliders and lists)
                const targetCards = document.querySelectorAll(`[data-anime-id="${idStr}"]`);
                targetCards.forEach(card => {
                    card.style.transform = 'scale(0.9)';
                    card.style.opacity = '0';
                    setTimeout(() => card.remove(), 300);
                });
                
                // Update Local Memory so Search continues to work properly
                enrichedLibraryItems = enrichedLibraryItems.filter(i => String(i.id) !== String(idStr));
                
                // If library is now totally empty, show the empty state
                if (enrichedLibraryItems.length === 0) {
                    document.getElementById('library-sliders-view').classList.add('hidden-el');
                    document.getElementById('library-search-view').classList.add('hidden-el');
                    document.getElementById('empty-state').classList.remove('hidden-el');
                }
            } catch (err) { console.error("[Library] Failed to remove:", err); }
        };

        // --- INITIALIZATION --- //
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await fetchAndRenderLibrary(user.uid);
            } else {
                document.getElementById('loading-state').classList.add('hidden-el');
                document.getElementById('empty-state').classList.remove('hidden-el');
                document.getElementById('empty-state').innerHTML = `
                    <div class="w-20 h-20 bg-[#111] rounded-full flex items-center justify-center border border-white/5 mb-4 shadow-lg">
                        <i class="fas fa-user-lock text-3xl text-[#F47521]"></i>
                    </div>
                    <h2 class="text-xl font-black text-white mb-2">Login Required</h2>
                    <p class="text-gray-400 text-sm max-w-xs leading-relaxed mb-6">You must be logged in to view your saved library.</p>
                    <button onclick="window.location.href='/index.html'" class="bg-[#F47521] text-white px-6 py-2.5 rounded-xl font-bold">Return Home</button>
                `;
            }
        });

        async function fetchAndRenderLibrary(uid) {
            try {
                const libRef = collection(db, "users", uid, "library");
                const snapshot = await getDocs(libRef);
                
                if (snapshot.empty) {
                    document.getElementById('loading-state').classList.add('hidden-el');
                    document.getElementById('empty-state').classList.remove('hidden-el');
                    return;
                }

                const rawItems = snapshot.docs.map(doc => doc.data());
                console.log('[Library] Raw Firestore items:', rawItems);
                
                // Process ALL items with the STRICT Exact-ID Data Engine
                enrichedLibraryItems = await enrichItemsStrictly(rawItems);
                console.log('[Library] Final Normalized Items:', enrichedLibraryItems);
                
                document.getElementById('loading-state').classList.add('hidden-el');
                document.getElementById('library-sliders-view').classList.remove('hidden-el');
                
                processAndRenderLayout();
            } catch (error) {
                console.error("[Library] Error fetching library:", error);
                document.getElementById('loading-state').innerHTML = `<p class="text-red-500 font-bold">Critical error loading library data.</p>`;
            }
        }

        // --- 🚀 THE NEW STRICT EXACT-ID DATA ENGINE --- //
        async function enrichItemsStrictly(rawItems) {
            
            // Use Promise.allSettled so one broken API doesn't kill the entire library
            const results = await Promise.allSettled(
                rawItems.map(async (item) => {
                    const animeId = String(item.id);
                    let apiData = null;
                    let anilistData = null;

                    console.log(`[Library] Fetching exact Anikoto anime info: ${animeId}`);

                    // 1. PRIMARY LOOKUP: Exact Anikoto Info Endpoint (Same as info.html)
                    try {
                        const res = await fetch(`${baseUrl}/api/info?id=${encodeURIComponent(animeId)}`);
                        if (res.ok) {
                            const json = await res.json();
                            // Safely handle Anikoto's varying response shells
                            apiData = json.data || json.results || json.animeInfo || json.anime || json;
                        }
                    } catch (e) {
                        console.warn(`[Library] Exact ID fetch failed for ${animeId}`, e);
                    }

                    // Extract strict AniList ID provided by Anikoto payload
                    const exactAlId = apiData?.alId || apiData?.anilistId || item?.anilistId || item?.alId;

                    // 2. SECONDARY ENRICHMENT: AniList by ID (Only if we have the ID to avoid sequel mixups)
                    try {
                        if (exactAlId) {
                            const aniQuery = `query($id: Int) { Media(id: $id, type: ANIME) { id title { english romaji native } status coverImage { extraLarge } bannerImage genres format description(asHtml: false) episodes } }`;
                            const res = await fetch('https://graphql.anilist.co', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ query: aniQuery, variables: { id: parseInt(exactAlId) } })
                            });
                            const json = await res.json();
                            if (json.data && json.data.Media) {
                                anilistData = json.data.Media;
                            }
                        }
                    } catch (e) {
                        console.warn(`[Library] AniList ID enrichment failed for ${animeId}`, e);
                    }

                    // 3. NORMALIZATION TO STRICT MODEL
                    
                    // Display Title Priorities (Best available API title)
                    const titleObj = apiData?.title || {};
                    const displayTitle = typeof titleObj === 'string' ? titleObj : (titleObj.english || titleObj.romaji || titleObj.native || anilistData?.title?.english || anilistData?.title?.romaji || item.title || 'Unknown Title');
                    
                    // Sub / Dub Extractions (Must come strictly from Anikoto)
                    let sub = apiData?.episodes?.sub ?? apiData?.tvInfo?.sub ?? apiData?.sub ?? item.sub ?? null;
                    let dub = apiData?.episodes?.dub ?? apiData?.tvInfo?.dub ?? apiData?.dub ?? item.dub ?? null;
                    sub = Number.isFinite(Number(sub)) ? Number(sub) : null;
                    dub = Number.isFinite(Number(dub)) ? Number(dub) : null;

                    // Status Normalization
                    let rawStatus = String(apiData?.status || anilistData?.status || item.releaseStatus || item.status || 'UNKNOWN').toUpperCase();
                    if (rawStatus.includes('ONGOING') || rawStatus.includes('RELEASING')) rawStatus = 'RELEASING';
                    else if (rawStatus.includes('UPCOMING') || rawStatus.includes('NOT_YET')) rawStatus = 'UPCOMING';
                    else if (rawStatus.includes('FINISHED') || rawStatus.includes('COMPLETED')) rawStatus = 'COMPLETED';

                    // Format Normalization
                    let rawFormat = String(apiData?.type || anilistData?.format || item.type || 'TV').toUpperCase();
                    if (rawFormat === 'TV_SHORT') rawFormat = 'TV';

                    // Genres (Merge, deduplicate, fallback to Uncategorized)
                    let genres = apiData?.genres || anilistData?.genres || [];
                    if (!Array.isArray(genres) || genres.length === 0) genres = ['Uncategorized'];
                    genres = [...new Set(genres)]; // Deduplicate just in case

                    // Authentic Synopsis
                    let synopsis = apiData?.description || apiData?.synopsis || anilistData?.description || item.description || "Synopsis unavailable.";
                    synopsis = synopsis.replace(/<[^>]*>?/gm, '').trim(); 

                    // Return Strict Normalized Model
                    return {
                        id: animeId,
                        title: displayTitle,
                        englishTitle: anilistData?.title?.english || '',
                        romajiTitle: anilistData?.title?.romaji || '',
                        nativeTitle: anilistData?.title?.native || '',
                        synonyms: Array.isArray(apiData?.synonyms) ? apiData.synonyms : [],
                        
                        // Poster Priority
                        poster: apiData?.image || apiData?.poster || item.img || item.image || anilistData?.coverImage?.extraLarge || 'https://via.placeholder.com/150x225?text=No+Cover',
                        banner: apiData?.cover || apiData?.bannerImage || anilistData?.bannerImage || null,
                        
                        synopsis: synopsis,
                        genres: genres,
                        format: rawFormat,
                        status: rawStatus,
                        sub: sub,
                        dub: dub,
                        
                        timestamp: item.timestamp || Date.now(), // Preserve exact Firestore save time
                        metadataSource: apiData ? 'api' : 'firestore-fallback'
                    };
                })
            );

            // Filter out rare rejections, return successfully normalized items
            return results
                .filter(res => res.status === 'fulfilled')
                .map(res => res.value);
        }

        // --- UI GENERATORS --- //

        // 1. SLIDER CARD (Matches action_slider.js flawlessly)
        function generateSliderCardHtml(item) {
            const safeTitle = (item.title || 'Untitled').replace(/'/g, "\\'");
            const isUpcoming = item.status === 'UPCOMING';
            
            const savedSvg = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-[#F47521]" viewBox="0 0 20 20" fill="currentColor"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" /></svg>`;
            const upcomingBadge = isUpcoming ? `<div class="absolute bottom-2 left-2 z-20 pointer-events-none"><span class="bg-[#F47521] text-white text-[9px] md:text-[10px] px-1.5 py-1 rounded font-black uppercase tracking-wide shadow-md">UPCOMING</span></div>` : '';
            const formatBadge = item.format ? `<span class="bg-black/80 backdrop-blur-sm text-white text-[10px] md:text-xs px-2 py-0.5 rounded border border-white/5 font-bold uppercase shadow-sm">${item.format}</span>` : '';
            
            // Authentic sub/dub representation
            const subBadge = item.sub !== null ? `<span class="bg-[#F47521]/90 backdrop-blur-sm text-white text-[10px] md:text-xs px-2 py-0.5 rounded shadow-sm font-bold">CC ${item.sub}</span>` : `<span class="bg-[#F47521]/90 backdrop-blur-sm text-white text-[10px] md:text-xs px-2 py-0.5 rounded shadow-sm font-bold">CC —</span>`;
            const dubBadge = (item.dub !== null && item.dub > 0) ? `<span class="bg-purple-600/90 backdrop-blur-sm text-white text-[10px] md:text-xs px-2 py-0.5 rounded shadow-sm font-bold"><i class="fas fa-microphone text-[9px] mr-0.5"></i> ${item.dub}</span>` : '';

            // Using data-anime-id for clean global DOM removals
            return `
            <div data-anime-id="${item.id}" class="snap-start shrink-0 w-[140px] md:w-[190px] relative group cursor-pointer transition-transform duration-300 hover:scale-[1.03] hover:z-10" onclick="window.sliderNavigate('${item.id}')">
                
                <div class="relative w-full aspect-[2/3] rounded-lg overflow-hidden shadow-lg border border-white/5 group-hover:border-[#F47521]/70 transition-colors bg-[#111]">
                    <img src="${item.poster}" loading="lazy" class="w-full h-full object-cover">
                    
                    <button onclick="window.removeFromLibrary(event, '${item.id}')" 
                            class="absolute top-2 right-2 z-30 p-2 rounded bg-black/80 backdrop-blur-md border border-white/5 shadow-md hover:bg-black transition-all flex items-center justify-center">
                        ${savedSvg}
                    </button>
                    
                    ${upcomingBadge}

                    <div class="absolute top-0 left-0 p-2 flex flex-col gap-1.5 items-start z-10 pointer-events-none">
                        ${formatBadge}
                        ${subBadge}
                        ${dubBadge}
                    </div>
                </div>
                
                <h3 class="mt-2 text-sm md:text-base text-gray-100 font-bold truncate group-hover:text-white transition-colors">${item.title}</h3>
            </div>
            `;
        }

        // 2. LIST VIEW CARD (Mimics search.js left-cover layout)
        function generateListCardHtml(item) {
            const safeTitle = item.title.replace(/'/g, "\\'");
            const listSaveBtn = `<button onclick="window.removeFromLibrary(event, '${item.id}')" class="text-[#F47521] bg-[#F47521]/10 px-2.5 py-1.5 rounded text-[10px] font-bold hover:bg-[#F47521] hover:text-black transition flex items-center gap-1.5"><i class="fas fa-check"></i> Saved</button>`;
            const subStr = item.sub !== null ? item.sub : '—';

            return `
            <div data-anime-id="${item.id}" onclick="window.sliderNavigate('${item.id}')" class="flex gap-4 items-stretch bg-gradient-to-br from-[#141414] to-[#0a0a0a] p-3 rounded-xl cursor-pointer hover:border-[#F47521]/50 border border-white/5 transition-all duration-300 shadow-md hover:shadow-xl hover:-translate-y-0.5 group h-full">
                <div class="relative w-24 md:w-28 shrink-0">
                    <img src="${item.poster}" class="w-full h-full object-cover rounded-lg shadow-md group-hover:brightness-110 transition">
                    <div class="absolute inset-0 bg-black/10 group-hover:bg-transparent transition rounded-lg"></div>
                </div>
                <div class="flex flex-col flex-1 min-w-0 justify-between py-1">
                    <div>
                        <h4 class="text-sm md:text-base font-bold text-white truncate group-hover:text-[#F47521] transition-colors">${item.title}</h4>
                        <p class="text-[10px] md:text-xs text-gray-400 line-clamp-2 mt-1.5 leading-relaxed">${item.synopsis}</p>
                    </div>
                    
                    <div class="flex flex-col gap-2 mt-3">
                        <div class="flex gap-2 items-center text-[9px] md:text-[10px] font-black uppercase tracking-wider">
                            <span class="text-gray-300 bg-black border border-white/10 px-1.5 py-0.5 rounded shadow-sm">${item.format}</span>
                            <span class="text-gray-300">SUB <span class="text-[#F47521]">${subStr}</span></span>
                            ${(item.dub !== null && item.dub > 0) ? `<span class="text-gray-300 border-l border-white/10 pl-2">DUB <span class="text-purple-400">${item.dub}</span></span>` : ''}
                        </div>
                        <div class="flex items-center gap-2 mt-1 border-t border-white/5 pt-2">
                            ${listSaveBtn}
                            <button onclick="event.stopPropagation(); window.shareAnime('${item.id}', '${safeTitle}')" class="text-gray-400 bg-white/5 px-2.5 py-1.5 rounded text-[10px] font-bold hover:bg-blue-500 hover:text-white transition flex items-center gap-1.5">
                                <i class="fas fa-share"></i> Share
                            </button>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // Horizontal Slider Block
        function buildSliderHtml(categoryTitle, items) {
            if (!items || items.length === 0) return '';
            const trackId = `track-${categoryTitle.replace(/[^a-zA-Z0-9]/g, '-')}`;
            
            return `
                <div id="container-${trackId}" class="mb-10 relative">
                    <div class="flex items-center justify-between mb-4 pl-4 md:pl-6 pr-4 border-l-4 border-[#F47521] ml-4 md:ml-6">
                        <h2 class="text-lg md:text-xl font-black text-white uppercase tracking-wider pl-3">
                            ${categoryTitle} <span class="text-xs text-gray-500 font-bold ml-2">(${items.length})</span>
                        </h2>
                    </div>
                    
                    <div class="relative group/slider">
                        <button onclick="scrollTrack('${trackId}', -1)" class="hidden md:flex absolute left-2 top-[40%] -translate-y-1/2 z-20 w-12 h-12 bg-black/90 hover:bg-[#F47521] border border-white/10 rounded-full items-center justify-center text-white opacity-0 group-hover/slider:opacity-100 transition-all shadow-xl">
                            <i class="fas fa-chevron-left text-lg"></i>
                        </button>
                        
                        <div id="${trackId}" class="slider-track flex gap-4 md:gap-5 overflow-x-auto snap-x snap-mandatory no-scrollbar pb-4 pt-2">
                            ${items.map(generateSliderCardHtml).join('')}
                        </div>
                        
                        <button onclick="scrollTrack('${trackId}', 1)" class="hidden md:flex absolute right-2 top-[40%] -translate-y-1/2 z-20 w-12 h-12 bg-black/90 hover:bg-[#F47521] border border-white/10 rounded-full items-center justify-center text-white opacity-0 group-hover/slider:opacity-100 transition-all shadow-xl">
                            <i class="fas fa-chevron-right text-lg"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // Big Rectangle Genre Tiles
        function buildGenreTilesHtml(allGenresArray) {
            if(allGenresArray.length === 0) return '';
            
            return `
                <div class="mb-12 relative mt-4">
                    <h2 class="text-xs font-bold text-gray-500 mb-4 pl-4 md:pl-6 uppercase tracking-widest border-b border-white/5 pb-2 mx-4 md:mx-6">
                        Browse by Genre
                    </h2>
                    <div class="relative group/slider">
                        <button onclick="scrollTrack('genre-tiles-track', -1)" class="hidden md:flex absolute left-2 top-[40%] -translate-y-1/2 z-20 w-12 h-12 bg-black/90 hover:bg-[#F47521] border border-white/10 rounded-full items-center justify-center text-white opacity-0 group-hover/slider:opacity-100 transition-all shadow-xl">
                            <i class="fas fa-chevron-left text-lg"></i>
                        </button>
                        
                        <div id="genre-tiles-track" class="slider-track flex gap-3 md:gap-4 overflow-x-auto snap-x snap-mandatory no-scrollbar pb-4 pt-2">
                            ${allGenresArray.map(g => {
                                return `
                                <div class="snap-start shrink-0 w-[160px] md:w-[220px] aspect-[16/9] relative rounded-xl overflow-hidden group cursor-pointer border border-white/5 shadow-lg hover:border-[#F47521]/50 transition-colors" onclick="openGenreList('${g.name}')">
                                    <img src="${g.bg}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 opacity-80 group-hover:opacity-100">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                                    <div class="absolute bottom-3 left-0 w-full text-center">
                                        <h3 class="text-white font-black text-base md:text-lg uppercase tracking-widest">${g.name}</h3>
                                        <p class="text-[9px] text-[#F47521] font-bold uppercase tracking-widest mt-0.5">${g.count} Series</p>
                                    </div>
                                </div>
                                `;
                            }).join('')}
                        </div>
                        
                        <button onclick="scrollTrack('genre-tiles-track', 1)" class="hidden md:flex absolute right-2 top-[40%] -translate-y-1/2 z-20 w-12 h-12 bg-black/90 hover:bg-[#F47521] border border-white/10 rounded-full items-center justify-center text-white opacity-0 group-hover/slider:opacity-100 transition-all shadow-xl">
                            <i class="fas fa-chevron-right text-lg"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // Logical Layout Coordinator
        function processAndRenderLayout() {
            // 1. Dynamic Top Categories (Meaningful Organization)
            const recentlyAdded = [...enrichedLibraryItems].sort((a, b) => b.timestamp - a.timestamp);
            const currentlyAiring = enrichedLibraryItems.filter(i => i.status === 'RELEASING');
            const completed = enrichedLibraryItems.filter(i => i.status === 'COMPLETED');
            const upcoming = enrichedLibraryItems.filter(i => i.status === 'UPCOMING');
            const movies = enrichedLibraryItems.filter(i => i.format === 'MOVIE');
            const tv = enrichedLibraryItems.filter(i => i.format === 'TV');
            const ovas = enrichedLibraryItems.filter(i => ['OVA', 'ONA', 'SPECIAL'].includes(i.format));

            let topHtml = '';
            topHtml += buildSliderHtml('Recently Added', recentlyAdded);
            topHtml += buildSliderHtml('Currently Airing', currentlyAiring);
            topHtml += buildSliderHtml('Upcoming', upcoming);
            topHtml += buildSliderHtml('Completed', completed);
            topHtml += buildSliderHtml('Movies', movies);
            topHtml += buildSliderHtml('TV Series', tv);
            topHtml += buildSliderHtml('Specials & OVAs', ovas);
            
            document.getElementById('top-sliders-mount').innerHTML = topHtml;

            // 2. Group by ALL Genres (An anime can be in Action AND Fantasy)
            groupedGenres = {};
            enrichedLibraryItems.forEach(item => {
                item.genres.forEach(g => {
                    const cleanGenre = g.trim();
                    if (!groupedGenres[cleanGenre]) groupedGenres[cleanGenre] = [];
                    // Deduplicate anime within the genre array using strict ID
                    if (!groupedGenres[cleanGenre].find(i => String(i.id) === String(item.id))) {
                        groupedGenres[cleanGenre].push(item);
                    }
                });
            });

            const sortedGenreKeys = Object.keys(groupedGenres).sort();

            // 3. The Big Rectangle Genre Tiles
            const allGenresData = sortedGenreKeys.map(k => ({
                name: k,
                count: groupedGenres[k].length, // True, deduplicated count
                bg: groupedGenres[k][0].banner || groupedGenres[k][0].poster // Prefer banner
            }));
            
            if (sortedGenreKeys.length > 0) {
                document.getElementById('genre-tiles-mount').innerHTML = buildGenreTilesHtml(allGenresData);
            }

            // 4. Remaining Genre Sliders
            let slidersHtml = '';
            sortedGenreKeys.forEach(k => slidersHtml += buildSliderHtml(k, groupedGenres[k]));
            document.getElementById('genre-sliders-mount').innerHTML = slidersHtml;
            
            console.log('[Library] Layout rendered successfully. Grouped Genres:', groupedGenres);
        }

        // --- FULLSCREEN GENRE LIST OVERLAY --- //
        window.openGenreList = (genreName) => {
            const overlay = document.getElementById('genre-list-overlay');
            const title = document.getElementById('genre-list-title');
            const mount = document.getElementById('genre-list-mount');
            
            title.innerText = genreName;
            
            const items = groupedGenres[genreName] || [];
            // Generate exact list-view style cards
            mount.innerHTML = items.map(generateListCardHtml).join('');
            
            overlay.classList.remove('hidden-el');
            overlay.classList.remove('list-overlay-exit');
            overlay.classList.add('list-overlay-enter');
        };

        window.closeGenreList = () => {
            const overlay = document.getElementById('genre-list-overlay');
            overlay.classList.remove('list-overlay-enter');
            overlay.classList.add('list-overlay-exit');
            setTimeout(() => {
                overlay.classList.add('hidden-el');
            }, 300);
        };

        // --- FAST LOCAL SEARCH ENGINE --- //
        window.handleSearch = () => {
            const query = document.getElementById('library-search').value.trim().toLowerCase();
            const clearBtn = document.getElementById('clear-search-btn');
            
            const slidersView = document.getElementById('library-sliders-view');
            const searchView = document.getElementById('library-search-view');
            const gridMount = document.getElementById('search-grid-mount');
            const countLabel = document.getElementById('search-results-count');

            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
                slidersView.classList.add('hidden-el');
                searchView.classList.remove('hidden-el');

                // Instant local filtering without triggering new API requests
                const filtered = enrichedLibraryItems.filter(item => {
                    const haystack = [
                        item.title,
                        item.englishTitle,
                        item.romajiTitle,
                        item.nativeTitle,
                        ...(item.synonyms || []),
                        item.format,
                        item.status,
                        ...(item.genres || [])
                    ].join(' ').toLowerCase();
                    return haystack.includes(query);
                });

                countLabel.innerText = `Search Results (${filtered.length})`;

                if (filtered.length === 0) {
                    gridMount.innerHTML = `
                        <div class="col-span-full text-center py-16">
                            <i class="fas fa-ghost text-4xl text-gray-800 mb-3"></i>
                            <p class="text-gray-600 font-bold uppercase tracking-widest text-sm">No matches found</p>
                        </div>
                    `;
                } else {
                    gridMount.innerHTML = filtered.map(generateListCardHtml).join('');
                }
            } else {
                clearSearch();
            }
        };

        window.clearSearch = () => {
            const searchInput = document.getElementById('library-search');
            searchInput.value = '';
            document.getElementById('clear-search-btn').classList.add('hidden');
            
            document.getElementById('library-search-view').classList.add('hidden-el');
            if (enrichedLibraryItems.length > 0) {
                document.getElementById('library-sliders-view').classList.remove('hidden-el');
            }
        };

        // Utility Share logic
        window.shareAnime = (id, title) => {
            if(window.navigator.share) {
                window.navigator.share({ title: `Watch ${title}`, url: `${window.location.origin}/info.html?id=${id}` });
            } else {
                navigator.clipboard.writeText(`${window.location.origin}/info.html?id=${id}`);
                alert("Link copied to clipboard!");
            }
        };

        // Fallback initialization for Bottom Navigation
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.app && window.app.components && window.app.components.bottomnav) {
                    window.app.components.bottomnav();
                }
            }, 500);
        });

    </script>
</body>
</html>
