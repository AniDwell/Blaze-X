
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Blaze-X</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .modal-overlay { visibility: hidden; opacity: 0; transition: all 0.3s ease; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        
        .toast { transform: translateY(150%); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .toast.active { transform: translateY(0); opacity: 1; }
        
        .dropdown-menu { transform-origin: top; transform: scaleY(0); opacity: 0; visibility: hidden; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .dropdown-menu.active { transform: scaleY(1); opacity: 1; visibility: visible; }
        
        .popup-enter { animation: popupFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .popup-exit { animation: popupFadeOut 0.4s ease-in forwards; }
        @keyframes popupFadeIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes popupFadeOut { from { opacity: 1; transform: translateY(10px) scale(0.98); } to { opacity: 0; transform: translateY(20px) scale(0.95); } }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-black text-white min-h-screen pb-10">

    <main class="container mx-auto px-4 pt-6 max-w-3xl relative z-10">
        
        <!-- Controls Row -->
        <div class="flex justify-between items-center mb-6">
            <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors">
                <i class="fas fa-arrow-left"></i>
            </button>

            <div class="flex items-center gap-3">
                <div class="relative z-50" id="custom-sort-wrapper">
                    <button onclick="window.app.toggleSortDropdown(event)" id="sort-display" class="bg-[#111] border border-white/10 text-xs font-bold text-gray-300 rounded-lg pl-4 pr-3 py-2.5 outline-none hover:border-white/20 transition-colors cursor-pointer uppercase tracking-wider flex items-center justify-between gap-3 min-w-[150px]">
                        <span>Newest First</span>
                        <i class="fas fa-chevron-down text-[10px] transition-transform duration-200" id="sort-arrow"></i>
                    </button>
                    <div id="sort-dropdown" class="dropdown-menu absolute top-full right-0 mt-2 w-full min-w-[150px] bg-[#111] border border-white/10 rounded-lg shadow-2xl overflow-hidden flex flex-col">
                        <button onclick="window.app.selectSort('date-desc', 'Newest First')" class="text-left px-4 py-3 text-xs font-bold text-gray-400 hover:bg-white/10 hover:text-white uppercase tracking-wider transition-colors border-b border-white/5">Newest First</button>
                        <button onclick="window.app.selectSort('date-asc', 'Oldest First')" class="text-left px-4 py-3 text-xs font-bold text-gray-400 hover:bg-white/10 hover:text-white uppercase tracking-wider transition-colors border-b border-white/5">Oldest First</button>
                    </div>
                </div>
                <button onclick="window.app.openClearAllModal()" class="text-xs font-bold text-gray-300 hover:text-white bg-gray-800 hover:bg-gray-700 px-4 py-2.5 rounded-lg transition-colors uppercase tracking-wider flex items-center gap-2">
                    <i class="fas fa-trash-alt"></i> Clear
                </button>
            </div>
        </div>

        <!-- Category Pills -->
        <div class="flex gap-3 overflow-x-auto pb-4 scrollbar-hide mb-2 border-b border-white/10" id="category-pills">
            <button onclick="window.app.setFilter('all')" data-filter="all" class="category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-[#F47521] text-white transition-all shadow-lg">All</button>
            <button onclick="window.app.setFilter('releases')" data-filter="releases" class="category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all">Releases</button>
            <button onclick="window.app.setFilter('social')" data-filter="social" class="category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all">Interactions</button>
            <button onclick="window.app.setFilter('library')" data-filter="library" class="category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all">Library</button>
        </div>

        <!-- Notifications Feed -->
        <div id="notifications-feed" class="flex flex-col gap-3 mt-4">
            <div class="flex justify-center items-center py-12">
                <i class="fas fa-spinner fa-spin text-3xl text-[#F47521]"></i>
            </div>
        </div>
    </main>

    <!-- Cinematic Release Notification Popup (Maintained from previous build) -->
    <div id="release-popup-wrapper" class="fixed inset-0 z-[200] hidden flex items-center justify-center p-4 pointer-events-none">
        <div id="release-popup-backdrop" class="absolute inset-0 bg-black/70 backdrop-blur-sm opacity-0 transition-opacity duration-300 pointer-events-auto"></div>
        <div id="release-popup-content" class="relative w-full max-w-md bg-[#0a0a0a] rounded-2xl overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.9)] border border-white/10 opacity-0 pointer-events-auto flex flex-col">
            <!-- (Queue Selector, Poster, Info, Action Buttons maintained here) -->
            <button onclick="window.app.closeReleasePopup()" class="absolute top-4 right-4 z-40 w-8 h-8 bg-black/50 hover:bg-[#F47521] backdrop-blur-md rounded-full text-white flex items-center justify-center transition-colors border border-white/10"><i class="fas fa-times"></i></button>
            <div class="relative w-full h-56 md:h-64 bg-[#111]">
                <img id="popup-poster" src="" class="w-full h-full object-cover opacity-60">
                <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-[#0a0a0a]/80 to-transparent"></div>
                <div class="absolute bottom-4 left-4 right-4 z-10">
                    <h2 id="popup-title" class="text-2xl font-black text-white leading-tight drop-shadow-lg line-clamp-2 mb-1"></h2>
                    <h3 id="popup-subtitle" class="text-sm text-[#F47521] font-bold tracking-wide drop-shadow-md"></h3>
                </div>
            </div>
            <div class="p-4 flex-1 bg-[#0a0a0a]">
                <p id="popup-synopsis" class="text-gray-300 text-xs md:text-sm line-clamp-3 leading-relaxed mb-6 font-medium"></p>
                <button id="popup-watch-btn" class="w-full bg-[#F47521] hover:bg-[#e06616] text-white font-black text-sm uppercase tracking-wider py-3 rounded-xl transition-colors flex items-center justify-center gap-2"><i class="fas fa-play"></i> Watch Now</button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="toast-message" class="toast fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 border border-white/10 text-white px-5 py-3 rounded-xl shadow-2xl z-[150] flex items-center gap-3 w-max max-w-[90vw]">
        <i class="fas fa-info-circle text-[#F47521] text-lg"></i>
        <span id="toast-text" class="text-sm font-medium tracking-wide"></span>
    </div>
    <div id="confirm-modal" class="modal-overlay fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex justify-center items-center px-4">
        <!-- Kept exactly as provided previously -->
    </div>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
        import { getFirestore, collection, onSnapshot, query, deleteDoc, doc, setDoc, writeBatch } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';

        window.app = window.app || {};
        window.app.state = window.app.state || {};
        window.app.state.allNotifications = [];
        window.app.state.currentFilter = 'all';
        window.app.state.currentSort = 'date-desc';

        const firebaseConfig = {
            apiKey: "AIzaSyChgVcbDPzc6AMeoac1hCOx39YK_1mEKvU",
            authDomain: "blaze-x-db2f5.firebaseapp.com",
            projectId: "blaze-x-db2f5",
            storageBucket: "blaze-x-db2f5.firebasestorage.app",
            messagingSenderId: "770812306638",
            appId: "1:770812306638:web:eaf5ded647861f32c25c9f"
        };

        const app = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];
        const auth = getAuth(app);
        const db = getFirestore(app);

        // =======================================================================
        // INTEGRATION: DETERMINISTIC SOCIAL NOTIFICATION HELPER
        // Call this from profile.js or comments.js when a user interacts.
        // Prevents duplicates and strictly assigns correct ownership/PFP.
        // =======================================================================
        window.app.interactionNotifier = {
            send: async (recipientUid, actorUid, actorName, actorImgBBPfp, actionType, targetId, textMessage, animeId = null) => {
                // SECURITY 1: Never notify yourself about your own action
                if (recipientUid === actorUid) return; 

                // DUPLICATE PREVENTION: Deterministic ID based on action
                const uniqueNotifId = `${actorUid}_${actionType}_${targetId}`;
                const notifRef = doc(db, "users", recipientUid, "notifications", uniqueNotifId);
                
                const payload = {
                    id: uniqueNotifId,
                    type: actionType, // 'profile_like', 'comment_like', 'comment_reply'
                    userId: actorUid, // Actor's ID for routing
                    username: actorName, // Actor's Name
                    userPfp: actorImgBBPfp, // Actor's ImgBB PFP
                    message: textMessage,
                    targetId: targetId, // ID of the comment or profile
                    animeId: animeId, // Useful if routing back to an Info.html thread
                    timestamp: Date.now(),
                    read: false
                };

                try {
                    await setDoc(notifRef, payload, { merge: true });
                } catch(e) {
                    console.error("Failed to write interaction notification", e);
                }
            }
        };

        // --- FILTER & SORT UI ---
        window.app.toggleSortDropdown = (e) => { e.stopPropagation(); document.getElementById('sort-dropdown').classList.toggle('active'); };
        window.app.selectSort = (val, text) => { window.app.state.currentSort = val; document.querySelector('#sort-display span').innerText = text; document.getElementById('sort-dropdown').classList.remove('active'); window.app.renderNotifications(); };
        window.app.setFilter = (type) => { 
            window.app.state.currentFilter = type; 
            document.querySelectorAll('.category-pill').forEach(p => { p.className = p.dataset.filter === type ? "category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-[#F47521] text-white transition-all shadow-lg" : "category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all"; });
            window.app.renderNotifications(); 
        };

        // --- ROUTING LOGIC ---
        // Respects existing info.html and profile.html/comment structures
        window.app.handleNotificationClick = async (type, animeId, userId) => {
            if (['profile_like', 'comment_like', 'comment_reply', 'like', 'comment'].includes(type)) {
                // If the comment was on an anime, route to info.html. Otherwise route to actor profile.
                if (animeId && animeId !== "null" && animeId !== "undefined") {
                    window.location.href = `/info.html?id=${animeId}`;
                } else if (userId && userId !== "null" && userId !== "undefined") {
                    window.location.href = `/profile.html?id=${userId}`;
                }
            } else if (['library', 'episode_released', 'series_released', 'release_delayed'].includes(type)) {
                if (animeId) window.location.href = `/info.html?id=${animeId}`;
            }
        };

        // --- RENDER NOTIFICATIONS FEED ---
        window.app.renderNotifications = () => {
            const feed = document.getElementById('notifications-feed');
            
            let processedData = window.app.state.currentFilter === 'all' 
                ? [...window.app.state.allNotifications] 
                : window.app.state.currentFilter === 'releases'
                    ? window.app.state.allNotifications.filter(n => ['episode_released', 'series_released', 'release_delayed'].includes(n.type))
                : window.app.state.currentFilter === 'social'
                    ? window.app.state.allNotifications.filter(n => ['profile_like', 'comment_like', 'comment_reply', 'like', 'comment'].includes(n.type))
                    : window.app.state.allNotifications.filter(n => n.type === window.app.state.currentFilter);

            processedData.sort((a, b) => {
                const timeA = a.timestamp || 0; const timeB = b.timestamp || 0;
                return window.app.state.currentSort === 'date-desc' ? timeB - timeA : timeA - timeB;
            });

            if (processedData.length === 0) {
                feed.innerHTML = `<div class="text-center py-16 text-gray-500 flex flex-col items-center"><i class="fas fa-bell-slash text-4xl mb-3 opacity-50"></i><p class="text-sm font-medium tracking-widest uppercase">No notifications found</p></div>`;
                return;
            }

            let html = '';
            processedData.forEach(notif => {
                // DETERMINE VISUALS: Is this an Anime notification or a Social interaction?
                const isSocial = ['profile_like', 'comment_like', 'comment_reply', 'like', 'comment'].includes(notif.type);
                
                // Priority: Anime Poster (for library/releases) -> Actor ImgBB PFP (for social) -> Fallback
                const imgUrl = isSocial 
                    ? (notif.userPfp || 'https://i.ibb.co/68032tS/default-pfp.jpg') 
                    : (notif.image || 'https://via.placeholder.com/150x225/111/fff?text=No+Image');

                // Determine Image Shape: Circular for Users, Vertical Rect for Anime Posters
                const imgClass = isSocial 
                    ? "w-16 h-16 md:w-16 md:h-16 object-cover rounded-full shadow-lg border-2 border-[#F47521]/50 shrink-0" 
                    : "w-16 h-20 md:w-20 md:h-28 object-cover rounded-lg shadow-lg border border-white/10 shrink-0";
                
                // Determine Title: Username (for social) or Anime Title (for library/releases)
                const displayTitle = isSocial ? notif.username : notif.title;

                let iconHtml = '';
                if(['profile_like', 'comment_like', 'like'].includes(notif.type)) iconHtml = '<i class="fas fa-heart text-red-500 text-xs"></i>';
                else if(['comment_reply', 'comment'].includes(notif.type)) iconHtml = '<i class="fas fa-comment text-blue-500 text-xs"></i>';
                else if(notif.type === 'library') iconHtml = '<i class="fas fa-bookmark text-green-500 text-xs"></i>';
                else if(notif.type === 'episode_released') iconHtml = '<i class="fas fa-play-circle text-[#F47521] text-xs"></i>';
                else if(notif.type === 'series_released') iconHtml = '<i class="fas fa-tv text-green-500 text-xs"></i>';
                else if(notif.type === 'release_delayed') iconHtml = '<i class="fas fa-clock text-yellow-500 text-xs"></i>';

                html += `
                    <div class="group flex gap-4 p-3 bg-white/5 border border-white/10 hover:border-[#F47521]/50 hover:bg-white/10 rounded-xl relative transition-all overflow-hidden items-center cursor-pointer shadow-md"
                         onclick="window.app.handleNotificationClick('${notif.type}', '${notif.animeId || ''}', '${notif.userId || ''}')">
                        
                        <div class="relative flex items-center justify-center h-full">
                            <img src="${imgUrl}" alt="Thumbnail" class="${imgClass}">
                        </div>
                        
                        <div class="flex-1 min-w-0 pr-8 py-1">
                            <div class="flex items-center gap-2 mb-1">
                                ${iconHtml}
                                <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">
                                    ${notif.timestamp ? new Date(notif.timestamp).toLocaleDateString() : 'New'}
                                </span>
                            </div>
                            <h3 class="text-white font-bold text-sm md:text-base leading-tight mb-1 truncate">${displayTitle || 'Notification'}</h3>
                            <p class="text-gray-400 text-xs md:text-sm line-clamp-2 leading-relaxed">
                                ${notif.message || ''}
                            </p>
                        </div>

                        <button onclick="event.stopPropagation(); window.app.deleteNotification('${notif.id}')" class="absolute top-1/2 -translate-y-1/2 right-4 text-gray-500 hover:text-red-500 w-8 h-8 rounded-full hover:bg-red-500/10 flex items-center justify-center transition-colors z-50">
                            <i class="fas fa-times text-lg"></i>
                        </button>
                    </div>
                `;
            });

            feed.innerHTML = html;
        };

        // --- DELETE & UTILS ---
        window.app.deleteNotification = async (docId) => {
            const user = auth.currentUser;
            if (!user) return;
            try { await deleteDoc(doc(db, "users", user.uid, "notifications", docId)); } catch (err) {}
        };
        window.app.openClearAllModal = () => { document.getElementById('confirm-modal').classList.add('active'); };
        window.app.closeModal = () => { document.getElementById('confirm-modal').classList.remove('active'); };

        // --- FIREBASE LISTENER (Canonical Source of Truth) ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Reusing the exact existing 'users/{uid}/notifications' structure
                const notifRef = collection(db, "users", user.uid, "notifications");
                const q = query(notifRef);

                onSnapshot(q, (snapshot) => {
                    const data = [];
                    snapshot.docs.forEach((doc) => data.push({ id: doc.id, ...doc.data() }));
                    window.app.state.allNotifications = data;
                    window.app.renderNotifications();
                });
            }
        });
    </script>
</body>
</html>
