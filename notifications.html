<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; }
        
        /* Hide scrollbar for category pills */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom Modal CSS */
        .modal-overlay {
            visibility: hidden; 
            opacity: 0; 
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            visibility: visible; 
            opacity: 1;
        }

        /* Custom Toast Alert CSS */
        .toast {
            transform: translateY(150%); 
            opacity: 0; 
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast.active {
            transform: translateY(0); 
            opacity: 1;
        }

        /* Custom CSS Dropdown Animation */
        .dropdown-menu {
            transform-origin: top;
            transform: scaleY(0);
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dropdown-menu.active {
            transform: scaleY(1);
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen pb-10">

    <main class="container mx-auto px-4 pt-6 max-w-3xl relative">
        
        <!-- Controls Row: Back Button, Sort, & Clear All -->
        <div class="flex justify-between items-center mb-6">
            
            <!-- Back Button -->
            <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors">
                <i class="fas fa-arrow-left"></i>
            </button>

            <div class="flex items-center gap-3">
                
                <!-- Custom CSS Sort Dropdown -->
                <div class="relative z-50" id="custom-sort-wrapper">
                    <!-- Dropdown Button -->
                    <button onclick="window.app.toggleSortDropdown(event)" id="sort-display" class="bg-[#111] border border-white/10 text-xs font-bold text-gray-300 rounded-lg pl-4 pr-3 py-2.5 outline-none hover:border-white/20 transition-colors cursor-pointer uppercase tracking-wider flex items-center justify-between gap-3 min-w-[150px]">
                        <span>Newest First</span>
                        <i class="fas fa-chevron-down text-[10px] transition-transform duration-200" id="sort-arrow"></i>
                    </button>

                    <!-- Dropdown Options List -->
                    <div id="sort-dropdown" class="dropdown-menu absolute top-full right-0 mt-2 w-full min-w-[150px] bg-[#111] border border-white/10 rounded-lg shadow-2xl overflow-hidden flex flex-col">
                        <button onclick="window.app.selectSort('date-desc', 'Newest First')" class="text-left px-4 py-3 text-xs font-bold text-gray-400 hover:bg-white/10 hover:text-white uppercase tracking-wider transition-colors border-b border-white/5">Newest First</button>
                        <button onclick="window.app.selectSort('date-asc', 'Oldest First')" class="text-left px-4 py-3 text-xs font-bold text-gray-400 hover:bg-white/10 hover:text-white uppercase tracking-wider transition-colors border-b border-white/5">Oldest First</button>
                        <button onclick="window.app.selectSort('alpha-asc', 'A-Z')" class="text-left px-4 py-3 text-xs font-bold text-gray-400 hover:bg-white/10 hover:text-white uppercase tracking-wider transition-colors border-b border-white/5">A-Z</button>
                        <button onclick="window.app.selectSort('alpha-desc', 'Z-A')" class="text-left px-4 py-3 text-xs font-bold text-gray-400 hover:bg-white/10 hover:text-white uppercase tracking-wider transition-colors">Z-A</button>
                    </div>
                </div>

                <!-- Grey Clear All Button -->
                <button onclick="window.app.openClearAllModal()" class="text-xs font-bold text-gray-300 hover:text-white bg-gray-800 hover:bg-gray-700 px-4 py-2.5 rounded-lg transition-colors uppercase tracking-wider flex items-center gap-2">
                    <i class="fas fa-trash-alt"></i> Clear
                </button>
            </div>
        </div>

        <!-- Category Pills -->
        <div class="flex gap-3 overflow-x-auto pb-4 scrollbar-hide mb-2 border-b border-white/10" id="category-pills">
            <button onclick="window.app.setFilter('all')" data-filter="all" class="category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-[#F47521] text-white transition-all shadow-lg">Most Recent</button>
            <button onclick="window.app.setFilter('like')" data-filter="like" class="category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all">Profile Likes</button>
            <button onclick="window.app.setFilter('comment')" data-filter="comment" class="category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all">Comments</button>
            <button onclick="window.app.setFilter('library')" data-filter="library" class="category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all">Library</button>
        </div>

        <!-- Notifications Feed -->
        <div id="notifications-feed" class="flex flex-col gap-3 mt-4">
            <!-- Loading State -->
            <div class="flex justify-center items-center py-12">
                <i class="fas fa-spinner fa-spin text-3xl text-[#F47521]"></i>
            </div>
        </div>
    </main>

    <!-- Custom Toast Alert -->
    <div id="toast-message" class="toast fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 border border-white/10 text-white px-5 py-3 rounded-xl shadow-2xl z-[150] flex items-center gap-3 w-max max-w-[90vw]">
        <i class="fas fa-info-circle text-[#F47521] text-lg"></i>
        <span id="toast-text" class="text-sm font-medium tracking-wide"></span>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="confirm-modal" class="modal-overlay fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex justify-center items-center px-4">
        <div class="bg-[#0a0a0a] border border-white/10 rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl transform transition-transform duration-300 scale-95" id="modal-content">
            <div class="w-14 h-14 bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-4 border border-white/5">
                <i class="fas fa-exclamation-triangle text-xl text-gray-400"></i>
            </div>
            <h3 class="text-lg font-bold mb-2 tracking-wide">Clear Notifications?</h3>
            <p class="text-gray-400 text-sm mb-6 leading-relaxed">Are you sure you want to delete all visible notifications? This action cannot be undone.</p>
            <div class="flex gap-3">
                <button onclick="window.app.closeModal()" class="flex-1 px-4 py-2.5 rounded-xl bg-white/5 text-white text-sm font-bold tracking-wider hover:bg-white/10 transition">CANCEL</button>
                <button onclick="window.app.confirmClearAll()" class="flex-1 px-4 py-2.5 rounded-xl bg-gray-800 text-white text-sm font-bold tracking-wider hover:bg-gray-700 transition">CLEAR ALL</button>
            </div>
        </div>
    </div>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
        import { getFirestore, collection, onSnapshot, query, deleteDoc, doc, writeBatch } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';

        window.app = window.app || {};
        window.app.state = window.app.state || {};
        window.app.state.allNotifications = [];
        window.app.state.currentFilter = 'all';
        window.app.state.currentSort = 'date-desc';

        const firebaseConfig = {
            apiKey: "AIzaSyChgVcbDPzc6AMeoac1hCOx39YK_1mEKvU",
            authDomain: "blaze-x-db2f5.firebaseapp.com",
            projectId: "blaze-x-db2f5",
            storageBucket: "blaze-x-db2f5.firebasestorage.app",
            messagingSenderId: "770812306638",
            appId: "1:770812306638:web:eaf5ded647861f32c25c9f"
        };

        const app = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- CUSTOM DROPDOWN LOGIC ---
        window.app.toggleSortDropdown = (e) => {
            e.stopPropagation();
            const dropdown = document.getElementById('sort-dropdown');
            const arrow = document.getElementById('sort-arrow');
            
            dropdown.classList.toggle('active');
            if (dropdown.classList.contains('active')) {
                arrow.style.transform = 'rotate(180deg)';
            } else {
                arrow.style.transform = 'rotate(0deg)';
            }
        };

        window.app.selectSort = (sortValue, displayText) => {
            // Update UI Button Text
            document.querySelector('#sort-display span').innerText = displayText;
            
            // Close Dropdown
            const dropdown = document.getElementById('sort-dropdown');
            const arrow = document.getElementById('sort-arrow');
            dropdown.classList.remove('active');
            arrow.style.transform = 'rotate(0deg)';
            
            // Apply Logic
            window.app.state.currentSort = sortValue;
            window.app.renderNotifications();
        };

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const wrapper = document.getElementById('custom-sort-wrapper');
            const dropdown = document.getElementById('sort-dropdown');
            const arrow = document.getElementById('sort-arrow');
            
            if (wrapper && !wrapper.contains(e.target)) {
                dropdown.classList.remove('active');
                if (arrow) arrow.style.transform = 'rotate(0deg)';
            }
        });

        // --- CUSTOM TOAST/MODAL TOOLS ---
        let toastTimeout;
        window.app.showToast = (msg) => {
            const toast = document.getElementById('toast-message');
            document.getElementById('toast-text').innerText = msg;
            toast.classList.add('active');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        };

        window.app.openClearAllModal = () => {
            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('modal-content');
            modal.classList.add('active');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        };

        window.app.closeModal = () => {
            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('active');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
        };

        // --- RENDER NOTIFICATIONS ---
        window.app.renderNotifications = () => {
            const feed = document.getElementById('notifications-feed');
            
            // 1. Filter Data
            let processedData = window.app.state.currentFilter === 'all' 
                ? [...window.app.state.allNotifications] 
                : window.app.state.allNotifications.filter(n => n.type === window.app.state.currentFilter);

            // 2. Sort Data
            processedData.sort((a, b) => {
                const timeA = a.timestamp || 0;
                const timeB = b.timestamp || 0;
                const titleA = (a.title || '').toLowerCase();
                const titleB = (b.title || '').toLowerCase();

                switch (window.app.state.currentSort) {
                    case 'date-desc': return timeB - timeA;
                    case 'date-asc': return timeA - timeB;
                    case 'alpha-asc': return titleA.localeCompare(titleB);
                    case 'alpha-desc': return titleB.localeCompare(titleA);
                    default: return 0;
                }
            });

            // 3. Render
            if (processedData.length === 0) {
                feed.innerHTML = `
                    <div class="text-center py-16 text-gray-500 flex flex-col items-center">
                        <i class="fas fa-bell-slash text-4xl mb-3 opacity-50"></i>
                        <p class="text-sm font-medium tracking-widest uppercase">No notifications found</p>
                    </div>`;
                return;
            }

            let html = '';
            processedData.forEach(notif => {
                const imgUrl = notif.image || 'https://via.placeholder.com/150x225/111/fff?text=No+Image';
                
                let iconHtml = '';
                if(notif.type === 'like') iconHtml = '<i class="fas fa-heart text-red-500 text-xs"></i>';
                else if(notif.type === 'comment') iconHtml = '<i class="fas fa-comment text-blue-500 text-xs"></i>';
                else if(notif.type === 'library') iconHtml = '<i class="fas fa-bookmark text-green-500 text-xs"></i>';

                html += `
                    <div class="group flex gap-4 p-3 bg-white/5 border border-white/10 hover:border-white/20 hover:bg-white/10 rounded-xl relative transition-all overflow-hidden items-center">
                        <div class="shrink-0 relative">
                            <img src="${imgUrl}" alt="Cover" class="w-16 h-20 md:w-20 md:h-28 object-cover rounded shadow-lg">
                        </div>
                        
                        <div class="flex-1 min-w-0 pr-8 py-1">
                            <div class="flex items-center gap-2 mb-1">
                                ${iconHtml}
                                <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">
                                    ${notif.timestamp ? new Date(notif.timestamp).toLocaleDateString() : 'New'}
                                </span>
                            </div>
                            <h3 class="text-white font-bold text-sm md:text-base leading-tight mb-1 truncate">${notif.title || 'Notification'}</h3>
                            <p class="text-gray-400 text-xs md:text-sm line-clamp-2 leading-relaxed">${notif.message || ''}</p>
                        </div>

                        <button onclick="window.app.deleteNotification('${notif.id}')" class="absolute top-1/2 -translate-y-1/2 right-4 text-gray-500 hover:text-red-500 w-8 h-8 rounded-full hover:bg-red-500/10 flex items-center justify-center transition-colors">
                            <i class="fas fa-times text-lg"></i>
                        </button>
                    </div>
                `;
            });

            feed.innerHTML = html;
        };

        // --- FILTER LOGIC ---
        window.app.setFilter = (type) => {
            window.app.state.currentFilter = type;
            document.querySelectorAll('.category-pill').forEach(pill => {
                if (pill.dataset.filter === type) {
                    pill.className = "category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-[#F47521] text-white transition-all shadow-lg";
                } else {
                    pill.className = "category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all";
                }
            });
            window.app.renderNotifications();
        };

        // --- DELETE LOGIC ---
        window.app.deleteNotification = async (docId) => {
            const user = auth.currentUser;
            if (!user) return;
            try {
                await deleteDoc(doc(db, "users", user.uid, "notifications", docId));
                window.app.showToast("Notification deleted");
            } catch (err) {
                console.error("Error deleting:", err);
                window.app.showToast("Failed to delete notification");
            }
        };

        window.app.confirmClearAll = async () => {
            window.app.closeModal();
            const user = auth.currentUser;
            if (!user) return;

            try {
                const toDelete = window.app.state.currentFilter === 'all' 
                    ? window.app.state.allNotifications 
                    : window.app.state.allNotifications.filter(n => n.type === window.app.state.currentFilter);

                if (toDelete.length === 0) {
                    window.app.showToast("No notifications to clear");
                    return;
                }

                const batch = writeBatch(db);
                toDelete.forEach(notif => {
                    const docRef = doc(db, "users", user.uid, "notifications", notif.id);
                    batch.delete(docRef);
                });

                await batch.commit();
                window.app.showToast("Notifications cleared successfully");
            } catch (err) {
                console.error("Error clearing:", err);
                window.app.showToast("Failed to clear notifications");
            }
        };

        // --- INITIALIZE LISTENER ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const notifRef = collection(db, "users", user.uid, "notifications");
                const q = query(notifRef);

                onSnapshot(q, (snapshot) => {
                    const data = [];
                    snapshot.forEach((doc) => {
                        data.push({ id: doc.id, ...doc.data() });
                    });
                    
                    window.app.state.allNotifications = data;
                    window.app.renderNotifications();
                }, (error) => {
                    console.error("Error fetching:", error);
                    document.getElementById('notifications-feed').innerHTML = `
                        <div class="text-center py-12 text-red-500 text-sm">Failed to load notifications.</div>`;
                });
            } else {
                document.getElementById('notifications-feed').innerHTML = `
                    <div class="text-center py-12 text-gray-500 uppercase tracking-widest text-sm">
                        Please log in to view notifications.
                    </div>`;
            }
        });
    </script>
</body>
</html>
