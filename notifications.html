<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; }
        
        /* Hide scrollbar for category pills */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom Modal CSS */
        .modal-overlay {
            visibility: hidden; 
            opacity: 0; 
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            visibility: visible; 
            opacity: 1;
        }

        /* Custom Toast Alert CSS */
        .toast {
            transform: translateY(150%); 
            opacity: 0; 
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast.active {
            transform: translateY(0); 
            opacity: 1;
        }

        /* Custom CSS Dropdown Animation */
        .dropdown-menu {
            transform-origin: top;
            transform: scaleY(0);
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dropdown-menu.active {
            transform: scaleY(1);
            opacity: 1;
            visibility: visible;
        }

        /* Cinematic Popup Animations */
        .popup-enter {
            animation: popupFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .popup-exit {
            animation: popupFadeOut 0.4s ease-in forwards;
        }
        @keyframes popupFadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes popupFadeOut {
            from { opacity: 1; transform: translateY(10px) scale(0.98); }
            to { opacity: 0; transform: translateY(20px) scale(0.95); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-black text-white min-h-screen pb-10">

    <main class="container mx-auto px-4 pt-6 max-w-3xl relative z-10">
        
        <!-- Controls Row: Back Button, Sort, & Clear All -->
        <div class="flex justify-between items-center mb-6">
            
            <!-- Back Button -->
            <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-white transition-colors">
                <i class="fas fa-arrow-left"></i>
            </button>

            <div class="flex items-center gap-3">
                
                <!-- Custom CSS Sort Dropdown -->
                <div class="relative z-50" id="custom-sort-wrapper">
                    <!-- Dropdown Button -->
                    <button onclick="window.app.toggleSortDropdown(event)" id="sort-display" class="bg-[#111] border border-white/10 text-xs font-bold text-gray-300 rounded-lg pl-4 pr-3 py-2.5 outline-none hover:border-white/20 transition-colors cursor-pointer uppercase tracking-wider flex items-center justify-between gap-3 min-w-[150px]">
                        <span>Newest First</span>
                        <i class="fas fa-chevron-down text-[10px] transition-transform duration-200" id="sort-arrow"></i>
                    </button>

                    <!-- Dropdown Options List -->
                    <div id="sort-dropdown" class="dropdown-menu absolute top-full right-0 mt-2 w-full min-w-[150px] bg-[#111] border border-white/10 rounded-lg shadow-2xl overflow-hidden flex flex-col">
                        <button onclick="window.app.selectSort('date-desc', 'Newest First')" class="text-left px-4 py-3 text-xs font-bold text-gray-400 hover:bg-white/10 hover:text-white uppercase tracking-wider transition-colors border-b border-white/5">Newest First</button>
                        <button onclick="window.app.selectSort('date-asc', 'Oldest First')" class="text-left px-4 py-3 text-xs font-bold text-gray-400 hover:bg-white/10 hover:text-white uppercase tracking-wider transition-colors border-b border-white/5">Oldest First</button>
                        <button onclick="window.app.selectSort('alpha-asc', 'A-Z')" class="text-left px-4 py-3 text-xs font-bold text-gray-400 hover:bg-white/10 hover:text-white uppercase tracking-wider transition-colors border-b border-white/5">A-Z</button>
                        <button onclick="window.app.selectSort('alpha-desc', 'Z-A')" class="text-left px-4 py-3 text-xs font-bold text-gray-400 hover:bg-white/10 hover:text-white uppercase tracking-wider transition-colors">Z-A</button>
                    </div>
                </div>

                <!-- Grey Clear All Button -->
                <button onclick="window.app.openClearAllModal()" class="text-xs font-bold text-gray-300 hover:text-white bg-gray-800 hover:bg-gray-700 px-4 py-2.5 rounded-lg transition-colors uppercase tracking-wider flex items-center gap-2">
                    <i class="fas fa-trash-alt"></i> Clear
                </button>
            </div>
        </div>

        <!-- Category Pills -->
        <div class="flex gap-3 overflow-x-auto pb-4 scrollbar-hide mb-2 border-b border-white/10" id="category-pills">
            <button onclick="window.app.setFilter('all')" data-filter="all" class="category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-[#F47521] text-white transition-all shadow-lg">Most Recent</button>
            <button onclick="window.app.setFilter('releases')" data-filter="releases" class="category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all">Releases</button>
            <button onclick="window.app.setFilter('like')" data-filter="like" class="category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all">Profile Likes</button>
            <button onclick="window.app.setFilter('comment')" data-filter="comment" class="category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all">Comments</button>
            <button onclick="window.app.setFilter('library')" data-filter="library" class="category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all">Library</button>
        </div>

        <!-- Notifications Feed -->
        <div id="notifications-feed" class="flex flex-col gap-4 mt-4">
            <!-- Loading State -->
            <div class="flex justify-center items-center py-12">
                <i class="fas fa-spinner fa-spin text-3xl text-[#F47521]"></i>
            </div>
        </div>
    </main>

    <!-- Cinematic Release Notification Popup (Queue System) -->
    <div id="release-popup-wrapper" class="fixed inset-0 z-[200] hidden flex items-center justify-center p-4 pointer-events-none">
        <div id="release-popup-backdrop" class="absolute inset-0 bg-black/70 backdrop-blur-sm opacity-0 transition-opacity duration-300 pointer-events-auto"></div>
        
        <div id="release-popup-content" class="relative w-full max-w-md bg-[#0a0a0a] rounded-2xl overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.9)] border border-white/10 opacity-0 pointer-events-auto flex flex-col">
            
            <!-- Anime Queue Selector Dropdown (Shown only if > 1 notification) -->
            <div id="popup-queue-selector" class="absolute top-0 left-0 right-0 z-50 bg-black/80 backdrop-blur-md border-b border-white/10 hidden">
                <button onclick="window.app.togglePopupQueue()" class="w-full px-4 py-3 flex items-center justify-between text-white text-sm font-bold tracking-wide hover:bg-white/5 transition-colors">
                    <span id="popup-queue-active-title" class="truncate pr-4">Select Anime</span>
                    <div class="flex items-center gap-2">
                        <span id="popup-queue-count" class="bg-[#F47521] text-white text-[10px] px-2 py-0.5 rounded-full"></span>
                        <i id="popup-queue-arrow" class="fas fa-chevron-down text-xs transition-transform duration-200"></i>
                    </div>
                </button>
                <div id="popup-queue-list" class="hidden max-h-48 overflow-y-auto no-scrollbar bg-[#111] border-t border-white/5">
                    <!-- Populated via JS -->
                </div>
            </div>

            <!-- Header / Close -->
            <button onclick="window.app.closeReleasePopup()" class="absolute top-4 right-4 z-40 w-8 h-8 bg-black/50 hover:bg-[#F47521] backdrop-blur-md rounded-full text-white flex items-center justify-center transition-colors border border-white/10">
                <i class="fas fa-times"></i>
            </button>

            <!-- Cinematic Image Area -->
            <div class="relative w-full h-56 md:h-64 bg-[#111]">
                <img id="popup-poster" src="" class="w-full h-full object-cover opacity-60">
                <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-[#0a0a0a]/80 to-transparent"></div>
                <div class="absolute inset-0 bg-gradient-to-r from-[#0a0a0a]/90 via-transparent to-transparent"></div>
                
                <div class="absolute bottom-4 left-4 right-4 z-10">
                    <div class="flex items-center gap-2 mb-2" id="popup-tags">
                        <span id="popup-type-badge" class="bg-[#F47521] text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider shadow-md"></span>
                        <span id="popup-sub-dub" class="bg-white/10 border border-white/20 text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider backdrop-blur-sm hidden"></span>
                    </div>
                    <h2 id="popup-title" class="text-2xl font-black text-white leading-tight drop-shadow-lg line-clamp-2 mb-1"></h2>
                    <h3 id="popup-subtitle" class="text-sm text-[#F47521] font-bold tracking-wide drop-shadow-md"></h3>
                </div>
            </div>

            <!-- Body Details -->
            <div class="p-4 md:p-5 flex-1 bg-[#0a0a0a]">
                <div id="popup-genres" class="flex flex-wrap gap-1.5 mb-3">
                    <!-- Genres populated here -->
                </div>
                <p id="popup-synopsis" class="text-gray-300 text-xs md:text-sm line-clamp-3 leading-relaxed mb-6 font-medium"></p>
                
                <!-- Action Buttons -->
                <div class="flex gap-3">
                    <button id="popup-watch-btn" class="flex-1 bg-[#F47521] hover:bg-[#e06616] text-white font-black text-sm uppercase tracking-wider py-3 rounded-xl transition-colors shadow-[0_4px_15px_rgba(244,117,33,0.3)] flex items-center justify-center gap-2">
                        <i class="fas fa-play"></i> Watch Now
                    </button>
                    <button id="popup-share-btn" class="w-12 h-12 bg-white/10 hover:bg-white/20 border border-white/10 rounded-xl flex items-center justify-center text-white transition-colors">
                        <i class="fas fa-share-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Toast Alert -->
    <div id="toast-message" class="toast fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 border border-white/10 text-white px-5 py-3 rounded-xl shadow-2xl z-[150] flex items-center gap-3 w-max max-w-[90vw]">
        <i class="fas fa-info-circle text-[#F47521] text-lg"></i>
        <span id="toast-text" class="text-sm font-medium tracking-wide"></span>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="confirm-modal" class="modal-overlay fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex justify-center items-center px-4">
        <!-- Kept exactly as provided -->
        <div class="bg-[#0a0a0a] border border-white/10 rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl transform transition-transform duration-300 scale-95" id="modal-content">
            <div class="w-14 h-14 bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-4 border border-white/5">
                <i class="fas fa-exclamation-triangle text-xl text-gray-400"></i>
            </div>
            <h3 class="text-lg font-bold mb-2 tracking-wide">Clear Notifications?</h3>
            <p class="text-gray-400 text-sm mb-6 leading-relaxed">Are you sure you want to delete all visible notifications? This action cannot be undone.</p>
            <div class="flex gap-3">
                <button onclick="window.app.closeModal()" class="flex-1 px-4 py-2.5 rounded-xl bg-white/5 text-white text-sm font-bold tracking-wider hover:bg-white/10 transition">CANCEL</button>
                <button onclick="window.app.confirmClearAll()" class="flex-1 px-4 py-2.5 rounded-xl bg-gray-800 text-white text-sm font-bold tracking-wider hover:bg-gray-700 transition">CLEAR ALL</button>
            </div>
        </div>
    </div>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
        import { getFirestore, collection, onSnapshot, query, deleteDoc, doc, setDoc, writeBatch } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';

        window.app = window.app || {};
        window.app.state = window.app.state || {};
        window.app.state.allNotifications = [];
        window.app.state.currentFilter = 'all';
        window.app.state.currentSort = 'date-desc';
        window.app.state.sessionStartTime = Date.now(); 

        window.app.state.popupQueue = [];
        window.app.state.activePopupIndex = 0;

        const firebaseConfig = {
            apiKey: "AIzaSyChgVcbDPzc6AMeoac1hCOx39YK_1mEKvU",
            authDomain: "blaze-x-db2f5.firebaseapp.com",
            projectId: "blaze-x-db2f5",
            storageBucket: "blaze-x-db2f5.firebasestorage.app",
            messagingSenderId: "770812306638",
            appId: "1:770812306638:web:eaf5ded647861f32c25c9f"
        };

        const app = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.app.db = db;
        window.app.auth = auth;

        // RELEASE MANAGER 
        window.app.releaseManager = {
            isChecking: false,
            apiBase: 'https://anikoto-api-lyart.vercel.app',
            cache: {},

            normalizeAnimeData: function(apiResponse) {
                return {
                    animeId: apiResponse.id || apiResponse.animeId,
                    title: apiResponse.title || apiResponse.name,
                    poster: apiResponse.image || apiResponse.poster,
                    synopsis: apiResponse.description || apiResponse.synopsis,
                    genres: apiResponse.genres || [],
                    sub: !!apiResponse.hasSub,
                    dub: !!apiResponse.hasDub,
                    episodes: apiResponse.episodes || apiResponse.episodeCount,
                    status: apiResponse.status || 'UNKNOWN'
                };
            },

            createNotification: async function(uid, eventType, animeData, specificMessage, uniqueSuffix) {
                const docId = `rel_${animeData.animeId}_${eventType}_${uniqueSuffix}`;
                const notifRef = doc(db, "users", uid, "notifications", docId);
                
                const notifPayload = {
                    type: eventType,
                    animeId: animeData.animeId,
                    title: animeData.title,
                    image: animeData.poster,
                    synopsis: animeData.synopsis,
                    genres: animeData.genres,
                    sub: animeData.sub,
                    dub: animeData.dub,
                    message: specificMessage,
                    timestamp: Date.now(),
                    read: false,
                    uniqueEventId: docId
                };

                try { await setDoc(notifRef, notifPayload, { merge: true }); } catch(e) { console.error("Failed to write release notification", e); }
            }
        };

        // CUSTOM DROPDOWN LOGIC 
        window.app.toggleSortDropdown = (e) => {
            e.stopPropagation();
            const dropdown = document.getElementById('sort-dropdown');
            const arrow = document.getElementById('sort-arrow');
            dropdown.classList.toggle('active');
            arrow.style.transform = dropdown.classList.contains('active') ? 'rotate(180deg)' : 'rotate(0deg)';
        };

        window.app.selectSort = (sortValue, displayText) => {
            document.querySelector('#sort-display span').innerText = displayText;
            const dropdown = document.getElementById('sort-dropdown');
            dropdown.classList.remove('active');
            document.getElementById('sort-arrow').style.transform = 'rotate(0deg)';
            window.app.state.currentSort = sortValue;
            window.app.renderNotifications();
        };

        // POPUP QUEUE UI MANAGER 
        window.app.enqueueReleasePopup = (notification) => {
            if (window.app.state.popupQueue.some(n => n.uniqueEventId === notification.uniqueEventId || n.id === notification.id)) return;
            window.app.state.popupQueue.push(notification);
            
            if (window.app.state.popupQueue.length === 1) {
                window.app.state.activePopupIndex = 0;
                window.app.renderActivePopup();
                window.app.showPopupContainer();
            } else {
                window.app.updatePopupQueueSelector();
            }
        };

        window.app.renderActivePopup = () => {
            const queue = window.app.state.popupQueue;
            if (!queue.length) return;
            const active = queue[window.app.state.activePopupIndex];

            document.getElementById('popup-poster').src = active.image || 'https://via.placeholder.com/400x600/111/fff?text=No+Image';
            document.getElementById('popup-title').innerText = active.title || 'Unknown Anime';
            document.getElementById('popup-subtitle').innerText = active.message || 'New update available';
            
            const badge = document.getElementById('popup-type-badge');
            if (active.type === 'episode_released') { badge.innerText = 'New Episode'; badge.className = 'bg-[#F47521] text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider shadow-md'; }
            else if (active.type === 'series_released') { badge.innerText = 'Series Released'; badge.className = 'bg-green-600 text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider shadow-md'; }
            else if (active.type === 'release_delayed') { badge.innerText = 'Delayed'; badge.className = 'bg-yellow-600 text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider shadow-md'; }
            else { badge.innerText = 'Update'; }

            const subDub = document.getElementById('popup-sub-dub');
            let langArr = [];
            if (active.sub) langArr.push('SUB');
            if (active.dub) langArr.push('DUB');
            if (langArr.length > 0) {
                subDub.innerText = langArr.join(' | ');
                subDub.classList.remove('hidden');
            } else { subDub.classList.add('hidden'); }

            document.getElementById('popup-synopsis').innerText = active.synopsis || 'No description available for this release.';
            const genresContainer = document.getElementById('popup-genres');
            if (active.genres && Array.isArray(active.genres)) {
                genresContainer.innerHTML = active.genres.slice(0, 3).map(g => `<span class="bg-white/10 border border-white/5 px-2 py-0.5 rounded text-[10px] font-bold text-gray-300">${g}</span>`).join('');
            } else { genresContainer.innerHTML = ''; }

            document.getElementById('popup-watch-btn').onclick = () => {
                window.app.closeReleasePopup();
                window.app.handleNotificationClick(active.type, active.animeId);
            };
            document.getElementById('popup-share-btn').onclick = () => {
                if(window.navigator.share) {
                    window.navigator.share({ title: active.title, text: active.message, url: `${window.location.origin}/info.html?id=${active.animeId}` });
                }
            };
            window.app.updatePopupQueueSelector();
        };

        window.app.updatePopupQueueSelector = () => {
            const queue = window.app.state.popupQueue;
            const selector = document.getElementById('popup-queue-selector');
            if (queue.length > 1) {
                selector.classList.remove('hidden');
                document.getElementById('popup-queue-count').innerText = queue.length;
                document.getElementById('popup-queue-active-title').innerText = queue[window.app.state.activePopupIndex].title;
                
                const list = document.getElementById('popup-queue-list');
                list.innerHTML = queue.map((n, idx) => `
                    <button onclick="window.app.switchPopupQueue(${idx})" class="w-full text-left px-4 py-3 border-b border-white/5 hover:bg-white/10 transition-colors flex justify-between items-center ${idx === window.app.state.activePopupIndex ? 'bg-white/5 text-[#F47521]' : 'text-gray-400'}">
                        <span class="text-sm font-bold truncate pr-4">${n.title}</span>
                        <span class="text-[10px] uppercase font-bold shrink-0">${n.type === 'release_delayed' ? 'Delayed' : 'New'}</span>
                    </button>
                `).join('');
            } else { selector.classList.add('hidden'); }
        };

        window.app.togglePopupQueue = () => {
            const list = document.getElementById('popup-queue-list');
            const arrow = document.getElementById('popup-queue-arrow');
            list.classList.toggle('hidden');
            arrow.style.transform = list.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        };

        window.app.switchPopupQueue = (index) => {
            window.app.state.activePopupIndex = index;
            document.getElementById('popup-queue-list').classList.add('hidden');
            document.getElementById('popup-queue-arrow').style.transform = 'rotate(0deg)';
            window.app.renderActivePopup();
        };

        window.app.showPopupContainer = () => {
            const wrapper = document.getElementById('release-popup-wrapper');
            const backdrop = document.getElementById('release-popup-backdrop');
            const content = document.getElementById('release-popup-content');
            
            wrapper.classList.remove('hidden');
            void wrapper.offsetWidth; 
            
            backdrop.classList.add('opacity-100');
            content.classList.remove('opacity-0');
            content.classList.add('popup-enter');
            content.classList.remove('popup-exit');
        };

        window.app.closeReleasePopup = () => {
            const backdrop = document.getElementById('release-popup-backdrop');
            const content = document.getElementById('release-popup-content');
            
            backdrop.classList.remove('opacity-100');
            content.classList.remove('popup-enter');
            content.classList.add('popup-exit');
            
            setTimeout(() => {
                document.getElementById('release-popup-wrapper').classList.add('hidden');
                window.app.state.popupQueue = [];
                window.app.state.activePopupIndex = 0;
            }, 400);
        };

        // CLICK ROUTING LOGIC
        window.app.handleNotificationClick = async (type, animeId, userId) => {
            if (type === 'like' && userId) {
                window.location.href = `/profile.html?id=${userId}`;
            } else if (['library', 'episode_released', 'series_released', 'release_delayed'].includes(type) && animeId) {
                // This routes directly to the anime page exactly like the carousel button 
                window.location.href = `/info.html?id=${animeId}`;
            }
        };

        // RENDER NOTIFICATIONS FEED (NEW CINEMATIC DESIGN)
        window.app.renderNotifications = () => {
            const feed = document.getElementById('notifications-feed');
            
            let processedData = window.app.state.currentFilter === 'all' 
                ? [...window.app.state.allNotifications] 
                : window.app.state.currentFilter === 'releases'
                    ? window.app.state.allNotifications.filter(n => ['episode_released', 'series_released', 'release_delayed'].includes(n.type))
                    : window.app.state.allNotifications.filter(n => n.type === window.app.state.currentFilter);

            processedData.sort((a, b) => {
                const timeA = a.timestamp || 0; const timeB = b.timestamp || 0;
                const titleA = (a.title || '').toLowerCase(); const titleB = (b.title || '').toLowerCase();
                switch (window.app.state.currentSort) {
                    case 'date-desc': return timeB - timeA;
                    case 'date-asc': return timeA - timeB;
                    case 'alpha-asc': return titleA.localeCompare(titleB);
                    case 'alpha-desc': return titleB.localeCompare(titleA);
                    default: return 0;
                }
            });

            if (processedData.length === 0) {
                feed.innerHTML = `
                    <div class="text-center py-16 text-gray-500 flex flex-col items-center">
                        <i class="fas fa-bell-slash text-4xl mb-3 opacity-50"></i>
                        <p class="text-sm font-medium tracking-widest uppercase">No notifications found</p>
                    </div>`;
                return;
            }

            let html = '';
            processedData.forEach(notif => {
                const imgUrl = notif.image || notif.userPfp || 'https://via.placeholder.com/150x225/111/fff?text=No+Image';
                
                // NEW: Larger, sleeker poster dimensions
                let imgClass = "w-20 h-28 md:w-28 md:h-40 object-cover rounded-xl shadow-lg transition-transform duration-500 group-hover:scale-105";
                let iconHtml = '';
                
                if(notif.type === 'like') { 
                    iconHtml = '<i class="fas fa-heart text-red-500 text-xs md:text-sm"></i>'; 
                    imgClass = "w-16 h-16 md:w-20 md:h-20 object-cover rounded-full shadow-lg border-2 border-[#F47521]/50 transition-transform duration-500 group-hover:scale-105"; 
                }
                else if(notif.type === 'comment') iconHtml = '<i class="fas fa-comment text-blue-500 text-xs md:text-sm"></i>';
                else if(notif.type === 'library') iconHtml = '<i class="fas fa-bookmark text-green-500 text-xs md:text-sm"></i>';
                else if(notif.type === 'episode_released') iconHtml = '<i class="fas fa-play-circle text-[#F47521] text-xs md:text-sm"></i>';
                else if(notif.type === 'series_released') iconHtml = '<i class="fas fa-tv text-green-500 text-xs md:text-sm"></i>';
                else if(notif.type === 'release_delayed') iconHtml = '<i class="fas fa-clock text-yellow-500 text-xs md:text-sm"></i>';

                const isAnimeCard = ['library', 'episode_released', 'series_released', 'release_delayed'].includes(notif.type);

                // NEW: Borderless card wrapper, scales and reveals play button on hover
                html += `
                    <div class="group flex gap-4 md:gap-6 p-3 md:p-4 bg-white/5 hover:bg-white/10 rounded-2xl relative transition-all overflow-hidden items-center cursor-pointer shadow-sm hover:shadow-xl border border-transparent"
                         onclick="window.app.handleNotificationClick('${notif.type}', '${notif.animeId || ''}', '${notif.userId || ''}')">
                        
                        <div class="shrink-0 relative flex items-center justify-center rounded-xl overflow-hidden shadow-md bg-[#111]">
                            <img src="${imgUrl}" alt="Cover" class="${imgClass}">
                            
                            <!-- Play Icon Hover Overlay for Series -->
                            ${isAnimeCard ? `
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center pointer-events-none">
                                <i class="fas fa-play text-white text-2xl md:text-3xl drop-shadow-lg scale-75 group-hover:scale-100 transition-transform duration-300"></i>
                            </div>
                            ` : ''}
                        </div>
                        
                        <div class="flex-1 min-w-0 pr-8 py-1">
                            <div class="flex items-center gap-2 mb-1.5 md:mb-2">
                                ${iconHtml}
                                <span class="text-[10px] md:text-xs text-[#F47521] font-bold uppercase tracking-widest">
                                    ${notif.timestamp ? new Date(notif.timestamp).toLocaleDateString() : 'New'}
                                </span>
                            </div>
                            <h3 class="text-white font-black text-base md:text-xl leading-tight mb-1.5 md:mb-2 truncate group-hover:text-[#F47521] transition-colors">${notif.title || 'Notification'}</h3>
                            <p class="text-gray-400 text-xs md:text-sm line-clamp-2 md:line-clamp-3 leading-relaxed font-medium">${notif.message || ''}</p>
                        </div>

                        <!-- Subtler Delete Button -->
                        <button onclick="event.stopPropagation(); window.app.deleteNotification('${notif.id}')" class="absolute top-1/2 -translate-y-1/2 right-3 md:right-5 text-gray-500 hover:text-red-500 w-10 h-10 rounded-full hover:bg-red-500/10 flex items-center justify-center transition-colors z-50">
                            <i class="fas fa-times text-lg md:text-xl"></i>
                        </button>
                    </div>
                `;
            });

            feed.innerHTML = html;
        };

        // FILTER, DELETE & MODAL LOGIC 
        window.app.setFilter = (type) => { 
            window.app.state.currentFilter = type;
            document.querySelectorAll('.category-pill').forEach(pill => {
                if (pill.dataset.filter === type) pill.className = "category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-[#F47521] text-white transition-all shadow-lg";
                else pill.className = "category-pill whitespace-nowrap px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all";
            });
            window.app.renderNotifications();
        };

        window.app.showToast = (msg) => { 
            const toast = document.getElementById('toast-message');
            document.getElementById('toast-text').innerText = msg;
            toast.classList.add('active');
            setTimeout(() => { toast.classList.remove('active'); }, 3000);
        };

        window.app.deleteNotification = async (docId) => { 
            const user = auth.currentUser;
            if (!user) return;
            try { await deleteDoc(doc(db, "users", user.uid, "notifications", docId)); window.app.showToast("Deleted"); } catch (err) {}
        };
        window.app.openClearAllModal = () => { document.getElementById('confirm-modal').classList.add('active'); };
        window.app.closeModal = () => { document.getElementById('confirm-modal').classList.remove('active'); };
        window.app.confirmClearAll = async () => { window.app.closeModal(); };

        // ENHANCED FIREBASE LISTENER 
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const notifRef = collection(db, "users", user.uid, "notifications");
                const q = query(notifRef);

                onSnapshot(q, (snapshot) => {
                    const data = [];
                    
                    snapshot.docs.forEach((doc) => data.push({ id: doc.id, ...doc.data() }));
                    window.app.state.allNotifications = data;
                    window.app.renderNotifications();

                    snapshot.docChanges().forEach((change) => {
                        if (change.type === "added") {
                            const notif = change.doc.data();
                            notif.id = change.doc.id;
                            
                            const isReleaseType = ['episode_released', 'series_released', 'release_delayed'].includes(notif.type);
                            const isNewSessionEvent = notif.timestamp && notif.timestamp > window.app.state.sessionStartTime;

                            if (isReleaseType && isNewSessionEvent && !notif.read) {
                                window.app.enqueueReleasePopup(notif);
                            }
                        }
                    });

                }, (error) => {
                    console.error("Error fetching:", error);
                    document.getElementById('notifications-feed').innerHTML = `<div class="text-center py-12 text-red-500 text-sm">Failed to load notifications.</div>`;
                });
            } else {
                document.getElementById('notifications-feed').innerHTML = `<div class="text-center py-12 text-gray-500 uppercase tracking-widest text-sm">Please log in to view notifications.</div>`;
            }
        });
    </script>
</body>
</html>
