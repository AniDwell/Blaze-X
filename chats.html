<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chats | BlazeX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --chat-theme: #F47521;
        }
        
        body {
            background-color: #030305;
            color: white;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        input {
            user-select: auto;
            -webkit-user-select: auto;
        }

        .theme-bg { background-color: var(--chat-theme) !important; }
        .theme-text { color: var(--chat-theme) !important; }
        .theme-border { border-color: var(--chat-theme) !important; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Modal Transitions */
        .modal-enter { transform: scale(0.95); opacity: 0; }
        .modal-enter-active { transform: scale(1); opacity: 1; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-20 relative">

    <!-- Header Container -->
    <div id="header-container" class="relative z-40 shadow-md"></div>

    <main class="flex-1 w-full max-w-3xl mx-auto px-4 pt-20 flex flex-col gap-4 relative z-10">
        
        <!-- Top Bar: Search & Group Add -->
        <div class="flex gap-3 items-center relative z-10 mt-2">
            <div class="relative flex-1">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                <input type="text" id="search-input" placeholder="Search chats or global users..." 
                    class="w-full bg-[#111] border border-white/10 rounded-full py-3 pl-11 pr-10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-[var(--chat-theme)] transition-colors shadow-inner">
                <button id="clear-search" class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <button onclick="window.app.openGroupModal()" class="shrink-0 w-12 h-12 theme-bg text-black rounded-full flex items-center justify-center shadow-[0_4px_15px_rgba(244,117,33,0.3)] hover:scale-105 transition-transform">
                <i class="fas fa-plus text-lg"></i>
            </button>
        </div>

        <!-- Category Pills -->
        <div id="category-pills" class="flex gap-3 overflow-x-auto pb-2 hide-scrollbar border-b border-white/5">
            <button onclick="window.app.setTab('chats')" data-tab="chats" class="tab-pill px-6 py-2 rounded-full text-xs font-bold uppercase tracking-wider theme-bg text-black transition-all shadow-md">Chats</button>
            <button onclick="window.app.setTab('groups')" data-tab="groups" class="tab-pill px-6 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-[#111] text-gray-400 border border-white/10 hover:bg-white/5 transition-all">Groups</button>
            <button onclick="window.app.setTab('requests')" data-tab="requests" class="tab-pill px-6 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-[#111] text-gray-400 border border-white/10 hover:bg-white/5 transition-all">Requests</button>
        </div>

        <!-- Standard Feed (Chats/Groups/Requests) -->
        <div id="main-feed" class="flex flex-col gap-2 mt-2">
            <!-- Loading State -->
            <div class="flex justify-center items-center py-16">
                <i class="fas fa-circle-notch fa-spin text-3xl theme-text"></i>
            </div>
        </div>

        <!-- Search Results Feed (Hidden by default) -->
        <div id="search-feed" class="hidden flex-col gap-6 mt-2">
            <!-- Global Users -->
            <div>
                <h3 class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 pl-2">Global Users</h3>
                <div id="search-users-results" class="flex flex-col gap-2"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Nav Container -->
    <div id="bottomnav-container" class="fixed bottom-0 w-full z-50"></div>

    <!-- ========================================== -->
    <!-- CUSTOM CSS MODALS                          -->
    <!-- ========================================== -->

    <!-- Unified Modal System (Matches chat.html) -->
    <div id="system-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[200] hidden items-center justify-center p-4 transition-opacity opacity-0">
        <div class="bg-[#111] border border-white/10 rounded-2xl w-full max-w-sm p-6 shadow-2xl modal-enter" id="system-modal-content">
            <h3 id="system-modal-title" class="text-white font-bold text-lg mb-2">Notice</h3>
            <p id="system-modal-msg" class="text-gray-300 text-sm mb-4"></p>
            <input type="text" id="system-modal-input" class="hidden bg-[#0a0a0a] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#F47521] w-full mb-4 transition-colors">
            <div class="flex justify-end gap-3 mt-2">
                <button id="system-modal-cancel" class="hidden px-4 py-2 text-sm font-medium text-gray-400 hover:text-white transition-colors">Cancel</button>
                <button id="system-modal-confirm" class="px-5 py-2 text-sm font-bold theme-bg text-black rounded-xl hover:scale-105 transition-transform shadow-md">OK</button>
            </div>
        </div>
    </div>

    <!-- Create Group Modal -->
    <div id="group-modal" class="fixed inset-0 z-[150] hidden flex-col bg-black/95 backdrop-blur-md pt-20 px-4 pb-4">
        <div class="max-w-md w-full mx-auto flex flex-col h-full relative">
            <button onclick="window.app.closeGroupModal()" class="absolute -top-12 right-0 text-gray-400 hover:text-white text-2xl p-2">
                <i class="fas fa-times"></i>
            </button>
            
            <h2 class="text-2xl font-black uppercase tracking-wider mb-6 theme-text drop-shadow-md">Create Group</h2>
            
            <input type="text" id="group-name-input" placeholder="Enter Group Name..." 
                class="w-full bg-[#111] border border-white/10 rounded-xl py-4 px-4 text-white placeholder-gray-500 focus:outline-none focus:border-[var(--chat-theme)] mb-6 shadow-inner">
            
            <h3 class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 pl-1">Search Users</h3>
            <input type="text" id="group-search-user" placeholder="Type to search..." 
                class="w-full bg-[#111] border border-white/10 rounded-xl py-3 px-4 text-sm text-white placeholder-gray-500 focus:outline-none mb-4 shadow-inner">
            
            <div id="group-search-results" class="flex-1 overflow-y-auto hide-scrollbar flex flex-col gap-2 pb-4">
                <div class="text-center py-8 text-gray-600 text-xs uppercase tracking-widest">Type to search users...</div>
            </div>

            <!-- Selected Users Pill Container -->
            <div id="selected-group-users" class="flex flex-wrap gap-2 mb-4 min-h-[30px]"></div>
            
            <button onclick="window.app.createGroupAction()" class="w-full theme-bg text-black py-4 rounded-xl font-black uppercase tracking-widest hover:scale-[1.02] transition-transform shadow-[0_4px_15px_rgba(244,117,33,0.3)]">
                Create Group
            </button>
        </div>
    </div>

    <!-- External Components -->
    <script src="/header.js"></script>
    <script src="/bottomnav.js"></script>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
        import { getFirestore, collection, onSnapshot, query, where, orderBy, deleteDoc, doc, getDocs, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyChgVcbDPzc6AMeoac1hCOx39YK_1mEKvU",
            authDomain: "blaze-x-db2f5.firebaseapp.com",
            projectId: "blaze-x-db2f5"
        };

        const fApp = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];
        const auth = getAuth(fApp);
        const db = getFirestore(fApp);

        window.app = window.app || {};
        
        let currentUser = null;
        let allChats = [];
        let currentTab = 'chats';
        let groupSelectedUsers = [];
        let pressTimer = null; 

        // --- CUSTOM UI MODAL (Matches chat.html) ---
        window.ui = {
            openModal: (title, message, showInput = false, showCancel = false) => {
                return new Promise((resolve) => {
                    const modal = document.getElementById('system-modal');
                    const content = document.getElementById('system-modal-content');
                    const elTitle = document.getElementById('system-modal-title');
                    const elMsg = document.getElementById('system-modal-msg');
                    const elInput = document.getElementById('system-modal-input');
                    const btnCancel = document.getElementById('system-modal-cancel');
                    const btnConfirm = document.getElementById('system-modal-confirm');

                    elTitle.innerText = title;
                    elMsg.innerText = message;
                    
                    if(showInput) {
                        elInput.value = "";
                        elInput.classList.remove('hidden');
                    } else {
                        elInput.classList.add('hidden');
                    }

                    if(showCancel) {
                        btnCancel.classList.remove('hidden');
                    } else {
                        btnCancel.classList.add('hidden');
                    }

                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                    setTimeout(() => {
                        modal.classList.remove('opacity-0');
                        content.classList.add('modal-enter-active');
                        if(showInput) elInput.focus();
                    }, 10);

                    const cleanup = () => {
                        modal.classList.add('opacity-0');
                        content.classList.remove('modal-enter-active');
                        setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 200);
                        btnCancel.onclick = null;
                        btnConfirm.onclick = null;
                    };

                    btnCancel.onclick = () => { cleanup(); resolve(null); };
                    btnConfirm.onclick = () => { cleanup(); resolve(showInput ? elInput.value : true); };
                });
            },
            alert: (msg) => window.ui.openModal("Notice", msg, false, false),
            confirm: (msg) => window.ui.openModal("Confirm", msg, false, true),
        };

        // --- TAB MANAGEMENT ---
        window.app.setTab = (tab) => {
            currentTab = tab;
            document.querySelectorAll('.tab-pill').forEach(pill => {
                if (pill.dataset.tab === tab) {
                    pill.className = "tab-pill px-6 py-2 rounded-full text-xs font-bold uppercase tracking-wider theme-bg text-black transition-all shadow-md";
                } else {
                    pill.className = "tab-pill px-6 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-[#111] text-gray-400 border border-white/10 hover:bg-white/5 transition-all";
                }
            });
            renderMainFeed();
        };

        // --- CORE NAVIGATION & PARENT DOC CREATOR ---
        window.app.startDirectChat = async (targetId) => {
            if (!currentUser) return;
            const chatRoomId = [currentUser.uid, targetId].sort().join('_');
            
            // To ensure it shows up in this list page in the future, we seed the parent document.
            try {
                const chatRef = doc(db, "chats", chatRoomId);
                const chatSnap = await getDoc(chatRef);
                if (!chatSnap.exists()) {
                    await setDoc(chatRef, {
                        type: 'direct',
                        participants: [currentUser.uid, targetId],
                        createdAt: serverTimestamp(),
                        lastMessage: 'Chat started',
                        lastMessageTime: serverTimestamp()
                    }, { merge: true });
                }
            } catch(e) { console.error(e); }

            // Navigate to your exact chat room UI
            window.location.href = `/chat.html?userA=${currentUser.uid}&userB=${targetId}`;
        };

        // --- RENDER MAIN FEED ---
        const renderMainFeed = () => {
            const feed = document.getElementById('main-feed');
            
            let filtered = [];
            if (currentTab === 'chats') filtered = allChats.filter(c => c.type === 'direct');
            else if (currentTab === 'groups') filtered = allChats.filter(c => c.type === 'group');
            else if (currentTab === 'requests') filtered = allChats.filter(c => c.isRequest); 

            if (filtered.length === 0) {
                feed.innerHTML = `
                    <div class="text-center py-20 text-gray-600 flex flex-col items-center">
                        <i class="fas fa-comment-slash text-4xl mb-4 opacity-30"></i>
                        <p class="text-xs font-black tracking-widest uppercase">No ${currentTab} found</p>
                    </div>`;
                return;
            }

            let html = '';
            filtered.forEach(chat => {
                const title = chat.type === 'group' ? chat.groupName : (chat.otherUserName || 'Unknown User');
                const img = chat.type === 'group' ? (chat.groupIcon || 'https://via.placeholder.com/150/333/fff?text=GRP') : (chat.otherUserImg || 'https://via.placeholder.com/150/111/fff?text=U');
                const subtext = chat.lastMessage || 'Started a conversation...';
                
                let timeStr = '';
                if(chat.lastMessageTime) {
                    const date = chat.lastMessageTime.toDate ? chat.lastMessageTime.toDate() : new Date();
                    timeStr = date.toLocaleDateString([], { month: 'short', day: 'numeric' });
                }

                html += `
                    <div data-id="${chat.id}" data-target="${chat.otherUserId || ''}" class="chat-item flex items-center gap-4 p-3.5 bg-[#111] border border-white/5 hover:border-[var(--chat-theme)] hover:bg-white/5 rounded-2xl cursor-pointer transition-all active:scale-[0.98]" oncontextmenu="return false;">
                        <img src="${img}" class="w-14 h-14 rounded-full object-cover shadow-md border border-white/10 shrink-0 pointer-events-none">
                        <div class="flex-1 min-w-0 pointer-events-none">
                            <div class="flex justify-between items-baseline mb-1">
                                <h3 class="text-white font-bold text-[15px] truncate tracking-wide">${title}</h3>
                                <span class="text-[10px] text-gray-500 font-bold tracking-wider">${timeStr}</span>
                            </div>
                            <p class="text-gray-400 text-xs truncate">${subtext}</p>
                        </div>
                    </div>
                `;
            });

            feed.innerHTML = html;
            attachLongPressListeners();
        };

        const attachLongPressListeners = () => {
            const items = document.querySelectorAll('.chat-item');
            items.forEach(item => {
                const id = item.dataset.id;
                const targetUid = item.dataset.target;
                
                const startTimer = (e) => {
                    pressTimer = setTimeout(async () => {
                        const confirm = await window.ui.confirm("Are you sure you want to delete this chat history?");
                        if (confirm) {
                            try {
                                await deleteDoc(doc(db, "chats", id));
                                // Subcollections (messages) require a cloud function to fully delete, 
                                // but deleting the parent hides it from this list.
                            } catch(err) {
                                window.ui.alert("Could not delete chat.");
                            }
                        }
                    }, 600); // 600ms long press
                };

                const clearTimer = () => { if (pressTimer) clearTimeout(pressTimer); };

                item.addEventListener('touchstart', startTimer, {passive: true});
                item.addEventListener('touchend', clearTimer);
                item.addEventListener('touchmove', clearTimer);
                item.addEventListener('mousedown', startTimer);
                item.addEventListener('mouseup', clearTimer);
                item.addEventListener('mouseleave', clearTimer);
                
                // Normal Click routing
                item.addEventListener('click', (e) => {
                    if (document.getElementById('system-modal').classList.contains('flex')) return;
                    
                    if(targetUid) {
                        window.app.startDirectChat(targetUid);
                    } else {
                        // Group logic routing (if supported in your app)
                        window.location.href = `/chat.html?groupId=${id}`;
                    }
                });
            });
        };

        // --- SEARCH GLOBAL USERS ---
        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-search');
        const mainFeed = document.getElementById('main-feed');
        const searchFeed = document.getElementById('search-feed');
        const categoryPills = document.getElementById('category-pills');

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.trim().toLowerCase();
            if (val.length > 0) {
                clearBtn.classList.remove('hidden');
                mainFeed.classList.add('hidden');
                categoryPills.classList.add('hidden');
                searchFeed.classList.remove('hidden');
                performGlobalSearch(val);
            } else {
                resetSearchUI();
            }
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            resetSearchUI();
        });

        const resetSearchUI = () => {
            clearBtn.classList.add('hidden');
            mainFeed.classList.remove('hidden');
            categoryPills.classList.remove('hidden');
            searchFeed.classList.add('hidden');
        };

        const performGlobalSearch = async (queryText) => {
            try {
                const usersRef = collection(db, "users");
                // Simple prefix search using Firestore ranges
                const q = query(usersRef, orderBy("username"), where("username", ">=", queryText), where("username", "<=", queryText + '\uf8ff'));
                const snap = await getDocs(q);
                
                const globalUsers = [];
                snap.forEach(doc => {
                    if (doc.id !== currentUser.uid) { 
                        globalUsers.push({ id: doc.id, ...doc.data() });
                    }
                });

                const container = document.getElementById('search-users-results');
                if (globalUsers.length === 0) {
                    container.innerHTML = '<div class="text-[11px] text-gray-600 uppercase tracking-widest pl-2 pt-4">No users found.</div>';
                    return;
                }

                let html = '';
                globalUsers.forEach(item => {
                    html += `
                        <div onclick="window.app.startDirectChat('${item.id}')" class="flex items-center gap-4 p-3 bg-[#111] rounded-2xl border border-white/5 cursor-pointer hover:border-[var(--chat-theme)] hover:bg-white/5 transition-all">
                            <img src="${item.photoURL || 'https://via.placeholder.com/150/111/fff?text=U'}" class="w-12 h-12 rounded-full object-cover border border-white/10">
                            <div class="flex-1 min-w-0">
                                <h4 class="text-white font-bold text-sm truncate">${item.username || item.displayName || 'Unknown User'}</h4>
                                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest truncate mt-0.5">Tap to chat</p>
                            </div>
                            <div class="w-8 h-8 rounded-full theme-bg text-black flex items-center justify-center shrink-0">
                                <i class="fas fa-paper-plane text-xs ml-[-2px]"></i>
                            </div>
                        </div>`;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error("Global search error", err);
            }
        };

        // --- GROUP CREATION LOGIC ---
        window.app.openGroupModal = () => {
            document.getElementById('group-modal').style.display = 'flex';
            groupSelectedUsers = [];
            renderSelectedGroupUsers();
            document.getElementById('group-search-results').innerHTML = '<div class="text-center py-8 text-gray-600 text-xs uppercase tracking-widest">Type to search users...</div>';
            document.getElementById('group-search-user').value = '';
            document.getElementById('group-name-input').value = '';
        };

        window.app.closeGroupModal = () => {
            document.getElementById('group-modal').style.display = 'none';
        };

        document.getElementById('group-search-user').addEventListener('input', async (e) => {
            const val = e.target.value.trim().toLowerCase();
            const resultsContainer = document.getElementById('group-search-results');
            
            if (val.length === 0) {
                resultsContainer.innerHTML = '<div class="text-center py-8 text-gray-600 text-xs uppercase tracking-widest">Type to search users...</div>';
                return;
            }

            try {
                const q = query(collection(db, "users"), orderBy("username"), where("username", ">=", val), where("username", "<=", val + '\uf8ff'));
                const snap = await getDocs(q);
                let html = '';
                
                snap.forEach(doc => {
                    if (doc.id === currentUser.uid) return;
                    const uData = doc.data();
                    const isAdded = groupSelectedUsers.find(u => u.id === doc.id);
                    const safeName = (uData.username || uData.displayName || '').replace(/'/g, "\\'");
                    
                    html += `
                        <div class="flex justify-between items-center bg-[#111] p-3 rounded-2xl border border-white/5">
                            <div class="flex items-center gap-3">
                                <img src="${uData.photoURL || 'https://via.placeholder.com/150/111/fff?text=U'}" class="w-10 h-10 rounded-full object-cover">
                                <span class="text-sm font-bold text-gray-200">${safeName || 'Unknown'}</span>
                            </div>
                            <button onclick="window.app.toggleGroupUser('${doc.id}', '${safeName}')" 
                                class="text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-full transition-colors ${isAdded ? 'bg-green-500 text-white' : 'bg-white/10 text-white hover:bg-white/20'}">
                                ${isAdded ? '<i class="fas fa-check"></i>' : 'Add'}
                            </button>
                        </div>
                    `;
                });
                
                resultsContainer.innerHTML = html || '<div class="text-center py-8 text-gray-600 text-xs uppercase tracking-widest">No users found</div>';
            } catch(e) { console.error(e); }
        });

        window.app.toggleGroupUser = (userId, userName) => {
            if (groupSelectedUsers.find(u => u.id === userId)) {
                groupSelectedUsers = groupSelectedUsers.filter(u => u.id !== userId);
            } else {
                groupSelectedUsers.push({ id: userId, name: userName });
            }
            renderSelectedGroupUsers();
            document.getElementById('group-search-user').dispatchEvent(new Event('input'));
        };

        const renderSelectedGroupUsers = () => {
            const container = document.getElementById('selected-group-users');
            if (groupSelectedUsers.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = groupSelectedUsers.map(u => `
                <div class="theme-bg text-black px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 shadow-md">
                    ${u.name}
                    <button onclick="window.app.toggleGroupUser('${u.id}', '${u.name}')" class="hover:text-white/80"><i class="fas fa-times"></i></button>
                </div>
            `).join('');
        };

        window.app.createGroupAction = async () => {
            const name = document.getElementById('group-name-input').value.trim();
            if (!name) return window.ui.alert("Please enter a group name.");
            if (groupSelectedUsers.length === 0) return window.ui.alert("Please add at least one member.");

            try {
                const participants = [currentUser.uid, ...groupSelectedUsers.map(u => u.id)];
                
                // Uses standard auto-ID for groups
                const groupRef = doc(collection(db, "chats"));
                await setDoc(groupRef, {
                    type: 'group',
                    groupName: name,
                    participants: participants,
                    lastMessage: "Group created",
                    lastMessageTime: serverTimestamp(),
                    createdAt: serverTimestamp(),
                    createdBy: currentUser.uid
                });

                window.app.closeGroupModal();
                window.location.href = `/chat.html?groupId=${groupRef.id}`;
            } catch (err) {
                window.ui.alert("Failed to create group.");
            }
        };

        // --- AUTH & FETCH CHATS ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                
                // Fetch user's chats (Depends on parent documents having 'participants' array)
                const q = query(
                    collection(db, "chats"), 
                    where("participants", "array-contains", user.uid),
                    orderBy("lastMessageTime", "desc")
                );

                onSnapshot(q, async (snapshot) => {
                    const rawChats = [];
                    snapshot.forEach(doc => {
                        rawChats.push({ id: doc.id, ...doc.data() });
                    });

                    // Enrich Direct Chats with Other User's Details
                    allChats = await Promise.all(rawChats.map(async chat => {
                        if (chat.type === 'direct' || !chat.type) { 
                            // Fallback if type missing but it's a 2 person chat
                            chat.type = 'direct';
                            const otherId = chat.participants.find(id => id !== user.uid);
                            if (otherId) {
                                chat.otherUserId = otherId;
                                try {
                                    const userDoc = await getDoc(doc(db, "users", otherId));
                                    if (userDoc.exists()) {
                                        const uData = userDoc.data();
                                        chat.otherUserName = uData.username || uData.displayName;
                                        chat.otherUserImg = uData.photoURL;
                                    }
                                } catch (e) {}
                            }
                        }
                        return chat;
                    }));

                    if (document.getElementById('search-feed').classList.contains('hidden')) {
                        renderMainFeed();
                    }
                }, (err) => {
                    console.error("Error fetching chats", err);
                    document.getElementById('main-feed').innerHTML = `<div class="text-center py-12 text-red-500">Failed to load chats.</div>`;
                });

            } else {
                currentUser = null;
                allChats = [];
                document.getElementById('main-feed').innerHTML = `
                    <div class="text-center py-20 text-gray-500 flex flex-col items-center">
                        <i class="fas fa-lock text-4xl mb-4 opacity-30"></i>
                        <p class="text-xs font-black tracking-widest uppercase">Please log in to view chats</p>
                    </div>`;
            }
        });
    </script>
</body>
</html>
