<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messages | BlazeX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --chat-theme: #F47521;
        }
        
        body {
            background-color: #030305;
            color: white;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            overflow: hidden; 
            touch-action: pan-y;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .theme-bg { background-color: var(--chat-theme) !important; }
        .theme-text { color: var(--chat-theme) !important; }
        .theme-border { border-color: var(--chat-theme) !important; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .chat-item { transition: background-color 0.2s ease; }
        .chat-item:active { background-color: rgba(255,255,255,0.1); }
        
        /* Skeleton Loading Animation */
        .skeleton { background: linear-gradient(90deg, #111 25%, #222 50%, #111 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="flex flex-col h-[100dvh]">

    <!-- Header -->
    <header class="flex items-center justify-between bg-[#0a0a0a] border-b border-white/5 px-4 py-3 shrink-0 relative z-40 shadow-md">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-black tracking-wide text-white">Messages</h1>
            <span id="unread-total" class="hidden bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
        </div>
        <div class="flex items-center gap-4">
            <button class="text-gray-400 hover:text-white transition-colors">
                <i class="fas fa-search text-lg"></i>
            </button>
            <button class="text-gray-400 hover:text-white transition-colors">
                <i class="fas fa-edit text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Chat List Container -->
    <main id="chat-list-container" class="flex-1 overflow-x-hidden overflow-y-auto hide-scrollbar bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-fixed pb-20">
        <!-- Skeleton Loader (Shows while fetching data) -->
        <div id="loading-skeletons" class="p-2 flex flex-col gap-1">
            <div class="flex items-center gap-3 p-3"><div class="w-14 h-14 rounded-full skeleton shrink-0"></div><div class="flex-1"><div class="h-4 w-32 skeleton rounded mb-2"></div><div class="h-3 w-48 skeleton rounded"></div></div></div>
            <div class="flex items-center gap-3 p-3"><div class="w-14 h-14 rounded-full skeleton shrink-0"></div><div class="flex-1"><div class="h-4 w-24 skeleton rounded mb-2"></div><div class="h-3 w-40 skeleton rounded"></div></div></div>
            <div class="flex items-center gap-3 p-3"><div class="w-14 h-14 rounded-full skeleton shrink-0"></div><div class="flex-1"><div class="h-4 w-36 skeleton rounded mb-2"></div><div class="h-3 w-56 skeleton rounded"></div></div></div>
        </div>
        
        <!-- Rendered Chats will go here -->
        <div id="chats-wrapper" class="flex flex-col"></div>
        
        <!-- Empty State -->
        <div id="empty-state" class="hidden flex-col items-center justify-center h-full text-center p-8 mt-20">
            <div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mb-4">
                <i class="fas fa-comments text-3xl text-gray-500"></i>
            </div>
            <h2 class="text-white font-bold text-lg mb-2">No messages yet</h2>
            <p class="text-gray-400 text-sm">When you start chatting with people, they will appear here.</p>
        </div>
    </main>

    <!-- Bottom Navigation (Example) -->
    <footer class="bg-[#0a0a0a] border-t border-white/5 px-6 py-3 shrink-0 fixed bottom-0 w-full z-50 flex items-center justify-between pb-6 md:pb-3">
        <button class="text-gray-500 hover:theme-text transition-colors flex flex-col items-center gap-1" onclick="window.location.href='/home.html'">
            <i class="fas fa-home text-xl"></i>
            <span class="text-[10px] font-medium">Home</span>
        </button>
        <button class="theme-text flex flex-col items-center gap-1">
            <i class="fas fa-comment text-xl drop-shadow-[0_0_8px_rgba(244,117,33,0.5)]"></i>
            <span class="text-[10px] font-bold">Chats</span>
        </button>
        <button class="text-gray-500 hover:theme-text transition-colors flex flex-col items-center gap-1" onclick="window.location.href='/explore.html'">
            <i class="fas fa-compass text-xl"></i>
            <span class="text-[10px] font-medium">Explore</span>
        </button>
        <button class="text-gray-500 hover:theme-text transition-colors flex flex-col items-center gap-1" onclick="window.location.href='/profile.html'">
            <i class="fas fa-user text-xl"></i>
            <span class="text-[10px] font-medium">Profile</span>
        </button>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // IMPORTANT: Replace with your actual Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyChgVcbDPzc6AMeoac1hCOx39YK_1mEKvU",
            authDomain: "blaze-x-db2f5.firebaseapp.com",
            projectId: "blaze-x-db2f5"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let activeUserId = null;
        const userCache = {}; // Cache to prevent fetching the same profile repeatedly

        onAuthStateChanged(auth, (user) => {
            if (user) {
                activeUserId = user.uid;
                listenToChatsList();
            } else {
                window.location.href = '/index.html'; // Redirect to login if not authenticated
            }
        });

        function listenToChatsList() {
            const chatsListRef = collection(db, "users", activeUserId, "chats_list");
            const q = query(chatsListRef, orderBy("timestamp", "desc"));

            onSnapshot(q, async (snapshot) => {
                document.getElementById('loading-skeletons').style.display = 'none';
                const wrapper = document.getElementById('chats-wrapper');
                const emptyState = document.getElementById('empty-state');
                const badgeTotal = document.getElementById('unread-total');

                if (snapshot.empty) {
                    wrapper.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    emptyState.classList.add('flex');
                    badgeTotal.classList.add('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                
                let totalUnread = 0;
                let htmlOutput = '';
                
                // Collect all necessary user profile fetches
                const fetchPromises = [];
                const docsData = [];

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const targetId = data.targetId;
                    data.id = docSnap.id; // the chatRoomId
                    docsData.push(data);

                    totalUnread += (data.unreadCount || 0);

                    // Fetch user details if not in cache
                    if (!userCache[targetId]) {
                        const userRef = doc(db, "users", targetId);
                        const fetchPromise = getDoc(userRef).then(uSnap => {
                            if (uSnap.exists()) {
                                userCache[targetId] = uSnap.data();
                            } else {
                                userCache[targetId] = { username: "Unknown User", photoURL: "https://ui-avatars.com/api/?name=User&background=111&color=fff" };
                            }
                        });
                        fetchPromises.push(fetchPromise);
                    }
                });

                // Wait for any new user profiles to load
                if (fetchPromises.length > 0) {
                    await Promise.all(fetchPromises);
                }

                // Render the list
                docsData.forEach(chatData => {
                    const targetProfile = userCache[chatData.targetId];
                    htmlOutput += generateChatItemHTML(chatData, targetProfile);
                });

                wrapper.innerHTML = htmlOutput;

                // Update Total Unread Badge in Header
                if (totalUnread > 0) {
                    badgeTotal.innerText = totalUnread > 99 ? '99+' : totalUnread;
                    badgeTotal.classList.remove('hidden');
                } else {
                    badgeTotal.classList.add('hidden');
                }
            });
        }

        function generateChatItemHTML(chatData, targetProfile) {
            const name = targetProfile.username || "Unknown User";
            const photo = targetProfile.photoURL || `https://ui-avatars.com/api/?name=${name}&background=111&color=F47521`;
            const lastMsg = chatData.lastMessage || "Started a chat";
            const unread = chatData.unreadCount || 0;
            
            // Format Time safely (handle null if server timestamp hasn't processed yet)
            let timeStr = '';
            if (chatData.timestamp) {
                timeStr = formatTime(chatData.timestamp.toDate());
            }

            const unreadBadge = unread > 0 
                ? `<div class="bg-[#F47521] text-black text-[10px] font-bold h-5 min-w-[20px] px-1.5 rounded-full flex items-center justify-center shadow-[0_2px_8px_rgba(244,117,33,0.4)]">${unread > 99 ? '99+' : unread}</div>`
                : '';

            const highlightClass = unread > 0 ? "text-white font-bold" : "text-gray-400 font-medium";

            return `
                <div class="chat-item flex items-center gap-3 p-3.5 border-b border-white/5 cursor-pointer relative" onclick="openChat('${chatData.targetId}')">
                    <div class="relative shrink-0">
                        <img src="${photo}" alt="${name}" class="w-14 h-14 rounded-full object-cover border border-white/10 bg-[#111]">
                        <!-- Optional: Online indicator circle could go here -->
                    </div>
                    <div class="flex-1 min-w-0 pr-1">
                        <div class="flex justify-between items-center mb-1">
                            <h3 class="text-white font-bold text-[15px] truncate tracking-wide">${name}</h3>
                            <span class="text-[11px] ${unread > 0 ? 'text-[#F47521] font-bold' : 'text-gray-500'} whitespace-nowrap ml-2">${timeStr}</span>
                        </div>
                        <div class="flex justify-between items-center gap-2">
                            <p class="text-sm truncate w-full ${highlightClass}">${lastMsg}</p>
                            ${unreadBadge}
                        </div>
                    </div>
                </div>
            `;
        }

        // Format date into human readable "10:30 AM", "Yesterday", or "Oct 24"
        function formatTime(date) {
            const now = new Date();
            const isToday = date.getDate() === now.getDate() && date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear();
            
            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);
            const isYesterday = date.getDate() === yesterday.getDate() && date.getMonth() === yesterday.getMonth() && date.getFullYear() === yesterday.getFullYear();

            if (isToday) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (isYesterday) {
                return 'Yesterday';
            } else {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
        }

        // Global routing function
        window.openChat = (targetId) => {
            // Because chatRoomId is created by sorting userA and userB, we just pass both in the URL.
            // In your chat.html logic, it reconstructs the chatRoomId perfectly.
            window.location.href = `/chat.html?userA=${activeUserId}&userB=${targetId}`;
        };
    </script>
</body>
</html>
