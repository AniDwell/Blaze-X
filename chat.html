<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chats</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Modal Transitions */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: all 0.2s ease-out; }
    </style>
</head>
<body class="bg-black text-white min-h-screen pb-24 select-none">

    <!-- Header Container -->
    <div id="header-container"></div>

    <main class="container mx-auto px-4 pt-16 max-w-3xl relative">
        
        <!-- Top Bar: Back Button & Title -->
        <div class="flex items-center gap-4 mb-6">
            <button onclick="window.history.back()" class="w-10 h-10 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center transition-colors text-white">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="text-2xl font-black uppercase tracking-wider text-white">Chats</h1>
        </div>

        <!-- Search & Group Add -->
        <div class="flex gap-3 items-center mb-4 relative z-10">
            <div class="relative flex-1">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search-input" placeholder="Search usernames or messages..." 
                    class="w-full bg-white/10 border border-white/10 rounded-full py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-[#F47521] focus:bg-white/20 transition-all">
                <button id="clear-search" class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <button onclick="window.app.openGroupModal()" class="shrink-0 w-10 h-10 bg-[#F47521] hover:bg-[#d8651a] rounded-full flex items-center justify-center text-white shadow-[0_0_15px_rgba(244,117,33,0.3)] transition-all">
                <i class="fas fa-plus"></i>
            </button>
        </div>

        <!-- Category Pills -->
        <div id="category-pills" class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide mb-4 border-b border-white/10">
            <button onclick="window.app.setTab('chats')" data-tab="chats" class="tab-pill px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-[#F47521] text-white transition-all shadow-lg">Chats</button>
            <button onclick="window.app.setTab('groups')" data-tab="groups" class="tab-pill px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all">Groups</button>
            <button onclick="window.app.setTab('requests')" data-tab="requests" class="tab-pill px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all">Requests</button>
        </div>

        <!-- Standard Feed (Chats/Groups/Requests) -->
        <div id="main-feed" class="flex flex-col gap-2">
            <!-- Loading State -->
            <div class="flex justify-center items-center py-12">
                <i class="fas fa-spinner fa-spin text-3xl text-[#F47521]"></i>
            </div>
        </div>

        <!-- Search Results Feed (Hidden by default) -->
        <div id="search-feed" class="hidden flex-col gap-6">
            <div>
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3 border-b border-white/10 pb-1">Matched Chats</h3>
                <div id="search-chats-results" class="flex flex-col gap-2"></div>
            </div>
            <div>
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3 border-b border-white/10 pb-1">Matched Messages</h3>
                <div id="search-messages-results" class="flex flex-col gap-2"></div>
            </div>
            <div>
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3 border-b border-white/10 pb-1">Global Users</h3>
                <div id="search-users-results" class="flex flex-col gap-2"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Nav Container -->
    <div id="bottomnav-container"></div>

    <!-- ========================================== -->
    <!-- MODALS & DROPDOWNS                         -->
    <!-- ========================================== -->

    <!-- Chat Options Dropdown Menu -->
    <div id="chat-options-menu" class="fixed hidden bg-[#111] border border-white/10 rounded-xl shadow-2xl z-[150] flex-col overflow-hidden w-36 origin-top-right transform transition-all scale-95 opacity-0">
        <button id="btn-pin-chat" class="w-full text-left px-4 py-3 text-xs font-bold text-gray-300 hover:bg-white/5 hover:text-white transition-colors border-b border-white/5"><i class="fas fa-thumbtack mr-2 w-4 text-center"></i> <span>Pin Chat</span></button>
        <button id="btn-block-user" class="w-full text-left px-4 py-3 text-xs font-bold text-yellow-500 hover:bg-yellow-500/10 transition-colors border-b border-white/5"><i class="fas fa-ban mr-2 w-4 text-center"></i> Block</button>
        <button id="btn-delete-chat" class="w-full text-left px-4 py-3 text-xs font-bold text-red-500 hover:bg-red-500/10 transition-colors"><i class="fas fa-trash-alt mr-2 w-4 text-center"></i> Delete</button>
    </div>

    <!-- Custom Alert Overlay -->
    <div id="custom-alert" class="fixed inset-0 z-[200] hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-[#111] border border-white/10 rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center">
            <div id="alert-icon" class="text-4xl mb-4 text-[#F47521]"><i class="fas fa-exclamation-circle"></i></div>
            <h3 id="alert-title" class="text-lg font-black uppercase tracking-wider mb-2">Notice</h3>
            <p id="alert-message" class="text-sm text-gray-400 mb-6 leading-relaxed">Message goes here.</p>
            <div class="flex gap-3 justify-center" id="alert-buttons"></div>
        </div>
    </div>

    <!-- Create Group Modal -->
    <div id="group-modal" class="fixed inset-0 z-[90] hidden flex-col bg-black/95 backdrop-blur-md pt-20 px-4 pb-0">
        <div class="max-w-md w-full mx-auto flex flex-col h-full relative">
            <button onclick="window.app.closeGroupModal()" class="absolute -top-12 right-0 text-gray-400 hover:text-white text-2xl">
                <i class="fas fa-times"></i>
            </button>
            
            <h2 class="text-2xl font-black uppercase tracking-wider mb-6 text-[#F47521]">Create Group</h2>
            
            <input type="text" id="group-name-input" placeholder="Enter Group Name..." 
                class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-white placeholder-gray-500 focus:outline-none focus:border-[#F47521] mb-6 shadow-inner">
            
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">Add Participants</h3>
            <input type="text" id="group-search-user" placeholder="Search usernames..." 
                class="w-full bg-white/5 border border-white/10 rounded-xl py-2 px-4 text-sm text-white placeholder-gray-500 focus:outline-none mb-4">
            
            <div id="selected-group-users" class="flex flex-wrap gap-2 mb-2"></div>
            
            <div id="group-search-results" class="flex-1 overflow-y-auto flex flex-col gap-2 pb-24 scrollbar-hide">
                <!-- Auto-populated with frequent chats by default -->
            </div>

            <!-- Absolute positioned above standard bottom nav area -->
            <div class="absolute bottom-24 left-0 right-0 pt-4 bg-gradient-to-t from-black via-black to-transparent">
                <button onclick="window.app.createGroupAction()" class="w-full bg-[#F47521] text-white py-3.5 rounded-xl font-bold uppercase tracking-widest hover:bg-[#d8651a] transition-colors shadow-[0_0_20px_rgba(244,117,33,0.3)]">
                    Create Group
                </button>
            </div>
        </div>
    </div>

    <!-- External Components -->
    <script src="header.js"></script>
    <script src="bottomnav.js"></script>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
        import { getFirestore, collection, onSnapshot, query, where, orderBy, deleteDoc, doc, getDocs, getDoc, addDoc, serverTimestamp, writeBatch, updateDoc } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';

        window.app = window.app || {};
        
        let currentUser = null;
        let allChats = [];
        let currentTab = 'chats';
        let groupSelectedUsers = [];
        let activeContextMenu = null; 

        const firebaseConfig = {
            apiKey: "AIzaSyChgVcbDPzc6AMeoac1hCOx39YK_1mEKvU",
            authDomain: "blaze-x-db2f5.firebaseapp.com",
            projectId: "blaze-x-db2f5"
        };

        const fApp = !getApps().length ? initializeApp(firebaseConfig) : getApps()[0];
        const auth = getAuth(fApp);
        const db = getFirestore(fApp);

        // --- GLOBAL CLICK LISTENER FOR DROPDOWN ---
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('chat-options-menu');
            if (activeContextMenu && !e.target.closest('#chat-options-menu') && !e.target.closest('.chat-options-btn')) {
                window.app.closeChatOptions();
            }
        });

        // --- CUSTOM ALERT UI ---
        window.app.showAlert = (title, message, type = 'info', onConfirm = null) => {
            const modal = document.getElementById('custom-alert');
            const titleEl = document.getElementById('alert-title');
            const msgEl = document.getElementById('alert-message');
            const iconEl = document.getElementById('alert-icon');
            const btnContainer = document.getElementById('alert-buttons');

            titleEl.innerText = title; msgEl.innerText = message;
            
            if(type === 'error') iconEl.innerHTML = '<i class="fas fa-times-circle text-red-500"></i>';
            else if(type === 'warning') iconEl.innerHTML = '<i class="fas fa-exclamation-triangle text-yellow-500"></i>';
            else iconEl.innerHTML = '<i class="fas fa-check-circle text-green-500"></i>';

            btnContainer.innerHTML = '';
            if (onConfirm) {
                const cancelBtn = document.createElement('button');
                cancelBtn.className = "px-6 py-2 rounded-lg bg-white/10 text-white font-bold text-sm tracking-widest uppercase";
                cancelBtn.innerText = "Cancel"; cancelBtn.onclick = () => { modal.style.display = 'none'; };
                
                const confirmBtn = document.createElement('button');
                confirmBtn.className = "px-6 py-2 rounded-lg bg-red-500 text-white font-bold text-sm tracking-widest uppercase shadow-lg";
                confirmBtn.innerText = "Confirm"; confirmBtn.onclick = () => { onConfirm(); modal.style.display = 'none'; };
                
                btnContainer.appendChild(cancelBtn); btnContainer.appendChild(confirmBtn);
            } else {
                const okBtn = document.createElement('button');
                okBtn.className = "px-8 py-2 rounded-lg bg-[#F47521] text-white font-bold text-sm tracking-widest uppercase shadow-lg";
                okBtn.innerText = "OK"; okBtn.onclick = () => { modal.style.display = 'none'; };
                btnContainer.appendChild(okBtn);
            }
            modal.style.display = 'flex';
        };

        // --- TAB MANAGEMENT ---
        window.app.setTab = (tab) => {
            currentTab = tab;
            document.querySelectorAll('.tab-pill').forEach(pill => {
                if (pill.dataset.tab === tab) pill.className = "tab-pill px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-[#F47521] text-white transition-all shadow-lg";
                else pill.className = "tab-pill px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white/10 text-gray-400 hover:bg-white/20 transition-all";
            });
            renderMainFeed();
        };

        // --- RENDER MAIN FEED ---
        const renderMainFeed = () => {
            const feed = document.getElementById('main-feed');
            
            let filtered = [];
            if (currentTab === 'chats') filtered = allChats.filter(c => c.type === 'direct' && !c.isRequest);
            else if (currentTab === 'groups') filtered = allChats.filter(c => c.type === 'group');
            else if (currentTab === 'requests') filtered = allChats.filter(c => c.isRequest); 

            // Sort by pinned first, then timestamp
            filtered.sort((a, b) => {
                if (a.pinned === b.pinned) return (b.lastMessageTime?.toMillis() || 0) - (a.lastMessageTime?.toMillis() || 0);
                return a.pinned ? -1 : 1;
            });

            if (filtered.length === 0) {
                feed.innerHTML = `
                    <div class="text-center py-16 text-gray-500 flex flex-col items-center">
                        <i class="fas fa-comment-slash text-4xl mb-3 opacity-50"></i>
                        <p class="text-sm font-medium tracking-widest uppercase">No ${currentTab} found</p>
                    </div>`;
                return;
            }

            let html = '';
            filtered.forEach(chat => {
                const title = chat.type === 'group' ? chat.groupName : (chat.otherUserName || chat.otherUsername || 'Unknown User');
                const img = chat.type === 'group' ? (chat.groupIcon || 'https://via.placeholder.com/150/333/fff?text=GRP') : (chat.otherUserImg || 'https://via.placeholder.com/150/111/fff?text=U');
                const subtext = chat.lastMessage || 'Started a conversation...';
                const timeStr = chat.lastMessageTime ? new Date(chat.lastMessageTime.toMillis()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                
                const unreadBadge = (chat.unreadCount && chat.unreadCount > 0) 
                    ? `<div class="bg-green-500 text-black text-[10px] font-bold px-1.5 py-0.5 rounded-full ml-2 shadow-sm">${chat.unreadCount}</div>` : '';
                
                const pinIcon = chat.pinned ? `<i class="fas fa-thumbtack text-[10px] text-[#F47521] rotate-45 ml-1"></i>` : '';

                // Safe routing format as requested
                const routeUrl = chat.type === 'direct' 
                    ? `/chats.html?userA=${currentUser.uid}&userB=${chat.targetId}` 
                    : `/group-chat.html?id=${chat.id}`;

                html += `
                    <div onclick="window.location.href='${routeUrl}'" class="chat-item flex items-center gap-4 p-3 bg-white/5 border border-white/5 hover:bg-white/10 rounded-xl cursor-pointer transition-all active:scale-[0.98] select-none relative group">
                        <img src="${img}" class="w-12 h-12 rounded-full object-cover shadow-md border border-white/10 shrink-0 pointer-events-none">
                        
                        <div class="flex-1 min-w-0 pointer-events-none pr-6">
                            <div class="flex justify-between items-baseline mb-0.5">
                                <h3 class="text-white font-bold text-sm truncate flex items-center">${title} ${pinIcon}</h3>
                                <div class="flex items-center">
                                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">${timeStr}</span>
                                    ${unreadBadge}
                                </div>
                            </div>
                            <p class="${chat.unreadCount > 0 ? 'text-white font-semibold' : 'text-gray-400'} text-xs truncate">${subtext}</p>
                        </div>
                        
                        <!-- Options Button -->
                        <button onclick="window.app.openChatOptions(event, '${chat.id}', ${chat.pinned ? 'true' : 'false'}, '${chat.targetId || ''}', '${chat.type}')" 
                                class="chat-options-btn absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/50 text-gray-400 hover:text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-10">
                            <i class="fas fa-ellipsis-v text-sm pointer-events-none"></i>
                        </button>
                    </div>
                `;
            });

            feed.innerHTML = html;
        };

        // --- CHAT OPTIONS MENU LOGIC ---
        window.app.openChatOptions = (e, chatId, isPinned, targetId, chatType) => {
            e.stopPropagation(); 
            activeContextMenu = { chatId, isPinned, targetId, chatType };

            const menu = document.getElementById('chat-options-menu');
            const pinBtn = document.getElementById('btn-pin-chat');
            const blockBtn = document.getElementById('btn-block-user');
            
            // Configure Pin Text
            pinBtn.innerHTML = isPinned 
                ? `<i class="fas fa-thumbtack mr-2 w-4 text-center opacity-50"></i> Unpin Chat` 
                : `<i class="fas fa-thumbtack mr-2 w-4 text-center text-[#F47521]"></i> Pin Chat`;
            
            // Hide Block option for groups
            blockBtn.style.display = chatType === 'group' ? 'none' : 'block';

            // Positioning Logic
            const rect = e.currentTarget.getBoundingClientRect();
            let top = rect.bottom + window.scrollY - 10;
            let left = rect.left + window.scrollX - 110; // offset to left

            if (top + 150 > window.innerHeight + window.scrollY) {
                top = rect.top + window.scrollY - 130; 
            }

            menu.style.top = `${top}px`;
            menu.style.left = `${left}px`;
            
            menu.classList.remove('hidden');
            setTimeout(() => {
                menu.classList.remove('scale-95', 'opacity-0');
            }, 10);

            // Bind Actions
            pinBtn.onclick = () => window.app.togglePinChat(chatId, isPinned);
            blockBtn.onclick = () => window.app.blockUser(targetId);
            document.getElementById('btn-delete-chat').onclick = () => window.app.deleteChatListEntry(chatId);
        };

        window.app.closeChatOptions = () => {
            const menu = document.getElementById('chat-options-menu');
            menu.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { menu.classList.add('hidden'); }, 150);
            activeContextMenu = null;
        };

        window.app.togglePinChat = async (chatId, currentStatus) => {
            window.app.closeChatOptions();
            try {
                await updateDoc(doc(db, "users", currentUser.uid, "chats_list", chatId), {
                    pinned: !currentStatus
                });
            } catch(e) { window.app.showAlert("Error", "Could not pin/unpin chat.", "error"); }
        };

        window.app.blockUser = (targetId) => {
            window.app.closeChatOptions();
            window.app.showAlert("Block User", "Are you sure you want to block this user? They will not be able to message you.", "warning", async () => {
                try {
                    // Chat blocking architecture applied to global chat doc
                    const roomIds = [currentUser.uid, targetId].sort();
                    const roomId = roomIds.join('_');
                    await updateDoc(doc(db, "chats", roomId), { blockedBy: currentUser.uid });
                    window.app.showAlert("Success", "User blocked.", "success");
                } catch(e) { console.error(e); window.app.showAlert("Error", "Failed to block user.", "error"); }
            });
        };

        window.app.deleteChatListEntry = (chatId) => {
            window.app.closeChatOptions();
            window.app.showAlert("Delete Chat", "Remove this chat from your list? (This won't delete the messages for the other person).", "warning", async () => {
                try { await deleteDoc(doc(db, "users", currentUser.uid, "chats_list", chatId)); } 
                catch(e) { window.app.showAlert("Error", "Could not delete chat.", "error"); }
            });
        };

        // --- SEARCH FUNCTIONALITY ---
        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-search');
        const mainFeed = document.getElementById('main-feed');
        const searchFeed = document.getElementById('search-feed');
        const categoryPills = document.getElementById('category-pills');

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.trim().toLowerCase();
            if (val.length > 0) {
                clearBtn.classList.remove('hidden');
                mainFeed.classList.add('hidden');
                categoryPills.classList.add('hidden');
                searchFeed.classList.remove('hidden');
                performSearch(val);
            } else {
                resetSearchUI();
            }
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            resetSearchUI();
        });

        const resetSearchUI = () => {
            clearBtn.classList.add('hidden');
            mainFeed.classList.remove('hidden');
            categoryPills.classList.remove('hidden');
            searchFeed.classList.add('hidden');
        };

        const performSearch = async (queryText) => {
            // Local Chat Search
            const matchedChats = allChats.filter(c => {
                const name = (c.type === 'group' ? c.groupName : (c.otherUserName || c.otherUsername)) || '';
                return name.toLowerCase().includes(queryText);
            });
            renderSearchResults('search-chats-results', matchedChats, 'chat');

            // Local Message Search
            const matchedMsgs = allChats.filter(c => {
                const msg = c.lastMessage || '';
                return msg.toLowerCase().includes(queryText);
            });
            renderSearchResults('search-messages-results', matchedMsgs, 'msg');

            // Global User Search (By Username)
            try {
                const usersRef = collection(db, "users");
                // Searching by 'username' field
                const q = query(usersRef, orderBy("username"), where("username", ">=", queryText), where("username", "<=", queryText + '\uf8ff'));
                const snap = await getDocs(q);
                const globalUsers = [];
                snap.forEach(doc => {
                    if (doc.id !== currentUser.uid) { globalUsers.push({ id: doc.id, ...doc.data() }); }
                });
                renderSearchResults('search-users-results', globalUsers, 'user');
            } catch (err) { console.error("Global search error", err); }
        };

        const renderSearchResults = (containerId, data, type) => {
            const container = document.getElementById(containerId);
            if (data.length === 0) {
                container.innerHTML = '<div class="text-[11px] text-gray-600 uppercase tracking-widest pl-2">No matches found.</div>';
                return;
            }

            let html = '';
            data.forEach(item => {
                if (type === 'chat' || type === 'msg') {
                    const title = item.type === 'group' ? item.groupName : (item.otherUserName || item.otherUsername);
                    const img = item.type === 'group' ? item.groupIcon : item.otherUserImg;
                    const sub = type === 'msg' ? `<span class="text-[#F47521]">Match:</span> ${item.lastMessage}` : 'Tap to open chat';
                    const routeUrl = item.type === 'direct' ? `/chats.html?userA=${currentUser.uid}&userB=${item.targetId}` : `/group-chat.html?id=${item.id}`;
                    
                    html += `
                        <div onclick="window.location.href='${routeUrl}'" class="flex items-center gap-3 p-2 bg-white/5 rounded-lg border border-white/5 cursor-pointer hover:bg-white/10">
                            <img src="${img || 'https://via.placeholder.com/150'}" class="w-10 h-10 rounded-full object-cover">
                            <div class="flex-1 min-w-0">
                                <h4 class="text-white font-bold text-sm truncate">${title}</h4>
                                <p class="text-gray-400 text-xs truncate">${sub}</p>
                            </div>
                        </div>`;
                } else if (type === 'user') {
                    html += `
                        <div onclick="window.location.href='/chats.html?userA=${currentUser.uid}&userB=${item.id}'" class="flex items-center gap-3 p-2 bg-white/5 rounded-lg border border-white/5 cursor-pointer hover:bg-white/10">
                            <img src="${item.photoURL || 'https://via.placeholder.com/150'}" class="w-10 h-10 rounded-full object-cover">
                            <div class="flex-1 min-w-0">
                                <h4 class="text-white font-bold text-sm truncate">${item.username || item.displayName || 'Unknown'}</h4>
                                <p class="text-gray-400 text-xs truncate">Global User</p>
                            </div>
                            <button class="bg-[#F47521]/10 text-[#F47521] p-2 rounded-full"><i class="fas fa-paper-plane"></i></button>
                        </div>`;
                }
            });
            container.innerHTML = html;
        };

        // --- GROUP CREATION LOGIC ---
        window.app.openGroupModal = () => {
            document.getElementById('group-modal').style.display = 'flex';
            groupSelectedUsers = [];
            renderSelectedGroupUsers();
            document.getElementById('group-search-user').value = '';
            document.getElementById('group-name-input').value = '';
            
            // Populate default frequent users (from active direct chats)
            renderDefaultGroupUsers();
        };

        window.app.closeGroupModal = () => {
            document.getElementById('group-modal').style.display = 'none';
        };

        const renderDefaultGroupUsers = () => {
            const resultsContainer = document.getElementById('group-search-results');
            const recentUsers = allChats.filter(c => c.type === 'direct').slice(0, 15);
            
            if (recentUsers.length === 0) {
                resultsContainer.innerHTML = '<div class="text-center py-8 text-gray-600 text-xs uppercase tracking-widest">Search to add users...</div>';
                return;
            }

            let html = '<div class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1 mt-2">Frequent Chats</div>';
            recentUsers.forEach(c => {
                const uName = c.otherUserName || c.otherUsername || 'Unknown';
                const uId = c.targetId;
                const img = c.otherUserImg || 'https://via.placeholder.com/150';
                const isAdded = groupSelectedUsers.find(u => u.id === uId);

                html += `
                    <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/5">
                        <div class="flex items-center gap-3">
                            <img src="${img}" class="w-8 h-8 rounded-full object-cover">
                            <span class="text-sm font-bold">${uName}</span>
                        </div>
                        <button onclick="window.app.tryAddUserToGroup('${uId}', '${uName.replace(/'/g, "\\'")}')" 
                            class="text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full ${isAdded ? 'bg-green-500 text-white' : 'bg-white/10 text-white hover:bg-white/20'} transition-colors">
                            ${isAdded ? '<i class="fas fa-check"></i>' : 'Add'}
                        </button>
                    </div>
                `;
            });
            resultsContainer.innerHTML = html;
        };

        document.getElementById('group-search-user').addEventListener('input', async (e) => {
            const val = e.target.value.trim().toLowerCase();
            const resultsContainer = document.getElementById('group-search-results');
            
            if (val.length === 0) {
                renderDefaultGroupUsers();
                return;
            }

            try {
                // Search by username
                const q = query(collection(db, "users"), orderBy("username"), where("username", ">=", val), where("username", "<=", val + '\uf8ff'));
                const snap = await getDocs(q);
                let html = '<div class="text-[10px] text-[#F47521] font-bold uppercase tracking-widest mb-1 mt-2">Search Results</div>';
                let found = false;

                snap.forEach(doc => {
                    if (doc.id === currentUser.uid) return;
                    found = true;
                    const uData = doc.data();
                    const uName = uData.username || uData.displayName || 'Unknown';
                    const isAdded = groupSelectedUsers.find(u => u.id === doc.id);
                    
                    html += `
                        <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/5">
                            <div class="flex items-center gap-3">
                                <img src="${uData.photoURL || 'https://via.placeholder.com/150'}" class="w-8 h-8 rounded-full object-cover">
                                <span class="text-sm font-bold">${uName}</span>
                            </div>
                            <button onclick="window.app.tryAddUserToGroup('${doc.id}', '${uName.replace(/'/g, "\\'")}')" 
                                class="text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full ${isAdded ? 'bg-green-500 text-white' : 'bg-white/10 text-white hover:bg-white/20'}">
                                ${isAdded ? '<i class="fas fa-check"></i>' : 'Add'}
                            </button>
                        </div>
                    `;
                });
                
                resultsContainer.innerHTML = found ? html : '<div class="text-center py-8 text-gray-600 text-xs uppercase tracking-widest">No users found</div>';
            } catch(e) { console.error(e); }
        });

        window.app.tryAddUserToGroup = async (userId, userName) => {
            if (groupSelectedUsers.find(u => u.id === userId)) return;
            groupSelectedUsers.push({ id: userId, name: userName });
            renderSelectedGroupUsers();
            
            // Re-render current list to update button state
            if(document.getElementById('group-search-user').value.trim() === '') {
                renderDefaultGroupUsers();
            } else {
                document.getElementById('group-search-user').dispatchEvent(new Event('input'));
            }
        };

        window.app.removeUserFromGroup = (userId) => {
            groupSelectedUsers = groupSelectedUsers.filter(u => u.id !== userId);
            renderSelectedGroupUsers();
            
            if(document.getElementById('group-search-user').value.trim() === '') {
                renderDefaultGroupUsers();
            } else {
                document.getElementById('group-search-user').dispatchEvent(new Event('input'));
            }
        };

        const renderSelectedGroupUsers = () => {
            const container = document.getElementById('selected-group-users');
            if (groupSelectedUsers.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = groupSelectedUsers.map(u => `
                <div class="bg-[#F47521]/20 border border-[#F47521]/50 text-[#F47521] px-3 py-1.5 rounded-full text-[10px] font-bold flex items-center gap-2 mb-2">
                    ${u.name}
                    <button onclick="window.app.removeUserFromGroup('${u.id}')" class="hover:text-white"><i class="fas fa-times"></i></button>
                </div>
            `).join('');
        };

        window.app.createGroupAction = async () => {
            const name = document.getElementById('group-name-input').value.trim();
            if (!name) return window.app.showAlert("Hold up!", "Please enter a group name.", "warning");
            if (groupSelectedUsers.length === 0) return window.app.showAlert("Hold up!", "Please add at least one participant.", "warning");

            try {
                const participants = [currentUser.uid, ...groupSelectedUsers.map(u => u.id)];
                
                const groupRef = await addDoc(collection(db, "chats"), {
                    type: 'group',
                    groupName: name,
                    participants: participants,
                    createdAt: serverTimestamp(),
                    createdBy: currentUser.uid
                });

                const batch = writeBatch(db);
                participants.forEach(participantId => {
                    const userChatListRef = doc(db, "users", participantId, "chats_list", groupRef.id);
                    batch.set(userChatListRef, {
                        lastMessage: "Group created",
                        timestamp: serverTimestamp(),
                        targetId: null, 
                        unreadCount: 0,
                        pinned: false
                    });
                });
                await batch.commit();

                window.app.closeGroupModal();
                window.app.showAlert("Success", "Group created successfully!", "success");
            } catch (err) {
                console.error(err);
                window.app.showAlert("Error", "Failed to create group.", "error");
            }
        };

        // --- AUTH & FETCH USER'S CHATS_LIST ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                
                const chatsListRef = collection(db, "users", user.uid, "chats_list");
                const q = query(chatsListRef, orderBy("timestamp", "desc"));

                onSnapshot(q, async (snapshot) => {
                    const rawList = [];
                    snapshot.forEach(doc => { rawList.push({ id: doc.id, ...doc.data() }); });

                    allChats = await Promise.all(rawList.map(async chatListDoc => {
                        let chatObj = {
                            id: chatListDoc.id,
                            lastMessage: chatListDoc.lastMessage,
                            lastMessageTime: chatListDoc.timestamp,
                            unreadCount: chatListDoc.unreadCount || 0,
                            targetId: chatListDoc.targetId,
                            type: chatListDoc.targetId ? 'direct' : 'group',
                            isRequest: chatListDoc.isRequest || false,
                            pinned: chatListDoc.pinned || false
                        };

                        if (chatObj.type === 'direct' && chatObj.targetId) {
                            try {
                                const userDoc = await getDoc(doc(db, "users", chatObj.targetId));
                                if (userDoc.exists()) {
                                    const uData = userDoc.data();
                                    chatObj.otherUserName = uData.displayName || "User";
                                    chatObj.otherUsername = uData.username || "";
                                    chatObj.otherUserImg = uData.photoURL;
                                }
                            } catch (e) {}
                        } else if (chatObj.type === 'group') {
                            try {
                                const groupDoc = await getDoc(doc(db, "chats", chatObj.id));
                                if (groupDoc.exists()) {
                                    const gData = groupDoc.data();
                                    chatObj.groupName = gData.groupName;
                                    chatObj.groupIcon = gData.groupIcon;
                                }
                            } catch (e) {}
                        }
                        
                        return chatObj;
                    }));

                    if (document.getElementById('search-feed').classList.contains('hidden')) {
                        renderMainFeed();
                    }
                });

            } else {
                currentUser = null;
                allChats = [];
                document.getElementById('main-feed').innerHTML = `
                    <div class="text-center py-12 text-gray-500 uppercase tracking-widest text-sm">
                        Please log in to view chats.
                    </div>`;
            }
        });
    </script>
</body>
</html>
