<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | AniKoto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Cropper.js for Image Cropping -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        body {
            background-color: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #F47521; border-radius: 10px; }
        .hidden-el { display: none !important; }
        
        /* Cropper Container overrides */
        .img-container {
            max-height: 60vh;
            width: 100%;
        }
        .cropper-view-box,
        .cropper-face {
            border-radius: 50%;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-20">

    <!-- Header Mount -->
    <div id="header-mount"></div>
    <script src="header.js"></script>

    <!-- Avatar Fullscreen Modal -->
    <div id="fullscreen-avatar-modal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center hidden-el opacity-0 transition-opacity duration-300">
        <button onclick="closeFullscreenAvatar()" class="absolute top-6 right-6 text-white text-3xl hover:text-gray-300">
            <i class="fas fa-times"></i>
        </button>
        <img id="modal-avatar-img" src="" alt="Fullscreen Preview" class="max-w-[90vw] max-h-[80vh] rounded-2xl object-contain border border-white/10">
    </div>

    <!-- PFP Crop Modal -->
    <div id="cropper-modal" class="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center hidden-el p-4">
        <div class="bg-[#0a0a0a] border border-white/10 rounded-2xl w-full max-w-xl overflow-hidden flex flex-col">
            <div class="p-4 border-b border-white/10 flex justify-between items-center">
                <h3 class="font-bold text-white"><i class="fas fa-crop text-[#F47521] mr-2"></i>Crop Profile Picture</h3>
                <button onclick="closeCropper()" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4 img-container bg-black/50">
                <img id="image-to-crop" src="" alt="Picture to crop" class="max-w-full block">
            </div>
            <div class="p-4 border-t border-white/10 flex justify-end gap-3">
                <button onclick="closeCropper()" class="px-4 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-sm font-bold">Cancel</button>
                <button onclick="saveCroppedImage()" class="px-4 py-2 bg-[#F47521] hover:bg-[#d96216] text-white rounded-xl text-sm font-bold shadow-lg">Save Avatar</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-8 pt-24">
        
        <!-- Profile Header Widget -->
        <div class="bg-gradient-to-br from-[#111] to-[#0a0a0a] border border-white/10 rounded-3xl p-6 md:p-10 shadow-2xl relative overflow-hidden mb-8 group">
            <div class="relative z-10 flex flex-col md:flex-row items-center md:items-start gap-6">
                
                <!-- Avatar System -->
                <div class="relative group/avatar shrink-0">
                    <div onclick="handleAvatarClick()" class="w-28 h-28 md:w-32 md:h-32 rounded-full p-1 bg-gradient-to-b from-[#F47521] to-transparent shadow-lg cursor-pointer">
                        <img id="user-avatar" src="https://ui-avatars.com/api/?name=User&background=111&color=F47521" alt="Profile Picture" class="w-full h-full rounded-full object-cover border-4 border-[#050505] bg-[#111]">
                    </div>
                    <!-- Owner Edit Upload Input -->
                    <label id="upload-pfp-btn" for="pfp-upload" class="hidden-el absolute bottom-0 right-0 bg-[#F47521] p-2.5 rounded-full border-2 border-[#050505] cursor-pointer hover:bg-white hover:text-black transition-colors text-white shadow-lg z-20">
                        <i class="fas fa-camera text-sm"></i>
                    </label>
                    <input type="file" id="pfp-upload" class="hidden" accept="image/*" onchange="initiatePfpUpload(event)">
                </div>
                
                <!-- Info Section -->
                <div class="flex-1 text-center md:text-left flex flex-col justify-center pt-2">
                    <div class="flex flex-col md:flex-row items-center gap-2 mb-1">
                        <h1 id="user-name" class="text-2xl md:text-4xl font-black tracking-tight text-white">Loading...</h1>
                        <span id="view-badge" class="bg-white/10 text-gray-300 px-2 py-0.5 rounded text-[10px] uppercase font-extrabold tracking-widest border border-white/10">Private View</span>
                    </div>
                    <p id="user-uid-display" class="text-xs text-[#F47521] font-mono mb-1 select-all"></p>
                    <p id="user-email" class="text-sm text-gray-400 mb-4 font-medium"></p>
                    
                    <div class="flex justify-center md:justify-start gap-4 mb-4">
                        <div id="like-metric-box" onclick="handleProfileLike()" class="flex flex-col items-center bg-black/30 border border-white/5 px-4 py-2 rounded-xl cursor-pointer hover:bg-white/5 transition-colors">
                            <span id="stat-likes-count" class="text-xl font-black text-[#F47521]">0</span>
                            <span class="text-[10px] uppercase tracking-wider text-gray-400 font-bold"><i id="heart-icon" class="far fa-heart mr-1"></i> Likes</span>
                        </div>
                    </div>
                </div>

                <!-- Desktop Quick Actions -->
                <div class="hidden md:flex flex-col gap-3 ml-auto mt-2 shrink-0 w-44">
                    <div id="owner-actions-desktop" class="space-y-2 hidden-el">
                        <button onclick="toggleSettingsPanel()" class="w-full bg-white/5 hover:bg-white/10 text-white border border-white/10 px-4 py-2.5 rounded-xl text-sm font-bold transition-all flex items-center gap-2 justify-center">
                            <i class="fas fa-cog"></i> Settings
                        </button>
                        <button onclick="handleLogout()" class="w-full bg-white/5 hover:bg-white/10 text-white border border-white/10 px-4 py-2.5 rounded-xl text-sm font-bold transition-all flex items-center gap-2 justify-center">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                    <div id="visitor-actions-desktop" class="space-y-2 hidden-el">
                        <button onclick="navigateToChat()" class="w-full bg-[#F47521] hover:bg-[#d96216] text-white px-4 py-3 rounded-xl text-sm font-black tracking-wide transition-all flex items-center gap-2 justify-center shadow-lg">
                            <i class="fas fa-paper-plane"></i> Message User
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Owner Settings Panel -->
        <div id="owner-settings-panel" class="mb-8 p-5 bg-[#0a0a0a] border border-white/10 rounded-2xl hidden-el transition-all">
            <h3 class="text-md font-bold mb-4 text-white flex items-center gap-2"><i class="fas fa-sliders-h text-[#F47521]"></i> Profile Settings Configuration</h3>
            <div class="space-y-4">
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Modify Username Handle</label>
                    <div class="flex gap-2">
                        <input type="text" id="input-edit-username" class="flex-1 bg-black border border-white/10 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-[#F47521]" placeholder="Change custom handle...">
                        <button onclick="updateProfileMetadata()" class="bg-white/10 hover:bg-white/20 px-4 text-xs font-bold rounded-xl transition-all">Save</button>
                    </div>
                </div>
                <div class="flex items-center justify-between p-3 bg-black/40 rounded-xl border border-white/5">
                    <div>
                        <p class="text-sm font-bold text-white">Hide Personal Watch Library</p>
                        <p class="text-xs text-gray-500">When enabled, visitors cannot see your anime library slider.</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-hide-library" onchange="handleLibraryVisibilityToggle()" class="sr-only peer">
                        <div class="w-11 h-6 bg-white/10 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-gray-400 after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#F47521] peer-checked:after:bg-white"></div>
                    </label>
                </div>
            </div>
        </div>

        <!-- OWNER DASHBOARD (Buttons Layout) -->
        <div id="owner-dashboard" class="hidden-el space-y-4">
            <h2 class="text-xl font-black text-white mb-4">Your Dashboard</h2>
            
            <button onclick="window.location.href='library.html'" class="w-full bg-[#0a0a0a] hover:bg-[#111] border border-white/5 hover:border-[#F47521]/50 p-5 rounded-2xl flex items-center justify-between transition-all group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-[#F47521]/10 text-[#F47521] flex items-center justify-center text-xl group-hover:scale-110 transition-transform"><i class="fas fa-bookmark"></i></div>
                    <div class="text-left">
                        <h3 class="font-bold text-white text-lg">My Library</h3>
                        <p class="text-xs text-gray-500">Manage your anime watchlists and catalogs</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-600 group-hover:text-[#F47521]"></i>
            </button>

            <button onclick="window.location.href='chats.html'" class="w-full bg-[#0a0a0a] hover:bg-[#111] border border-white/5 hover:border-[#F47521]/50 p-5 rounded-2xl flex items-center justify-between transition-all group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-500 flex items-center justify-center text-xl group-hover:scale-110 transition-transform"><i class="fas fa-comments"></i></div>
                    <div class="text-left">
                        <h3 class="font-bold text-white text-lg">Messages & Chats</h3>
                        <p class="text-xs text-gray-500">View your active direct messages</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-600 group-hover:text-blue-500"></i>
            </button>

            <button onclick="window.location.href='notifications.html'" class="w-full bg-[#0a0a0a] hover:bg-[#111] border border-white/5 hover:border-[#F47521]/50 p-5 rounded-2xl flex items-center justify-between transition-all group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-purple-500/10 text-purple-500 flex items-center justify-center text-xl group-hover:scale-110 transition-transform"><i class="fas fa-bell"></i></div>
                    <div class="text-left">
                        <h3 class="font-bold text-white text-lg">Notifications</h3>
                        <p class="text-xs text-gray-500">Check recent alerts and updates</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-600 group-hover:text-purple-500"></i>
            </button>

            <button onclick="window.location.href='history.html'" class="w-full bg-[#0a0a0a] hover:bg-[#111] border border-white/5 hover:border-[#F47521]/50 p-5 rounded-2xl flex items-center justify-between transition-all group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-green-500/10 text-green-500 flex items-center justify-center text-xl group-hover:scale-110 transition-transform"><i class="fas fa-history"></i></div>
                    <div class="text-left">
                        <h3 class="font-bold text-white text-lg">Watch History</h3>
                        <p class="text-xs text-gray-500">Review your recently viewed activity</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-600 group-hover:text-green-500"></i>
            </button>
        </div>

        <!-- VISITOR DASHBOARD (Library Slider Layout) -->
        <div id="visitor-dashboard" class="hidden-el space-y-6">
            <div id="visitor-library-container" class="bg-[#0a0a0a] rounded-2xl border border-white/5 p-5">
                <h3 class="text-lg font-bold text-white mb-4 flex items-center justify-between">
                    <span><i class="fas fa-bookmark text-[#F47521] mr-2"></i> User Library</span>
                    <span id="visitor-library-status" class="text-xs bg-white/5 px-2 py-1 rounded text-gray-400">Loading...</span>
                </h3>
                
                <!-- Horizontal Slider -->
                <div id="visitor-library-slider" class="flex overflow-x-auto gap-4 pb-4 snap-x snap-mandatory hide-scroll">
                    <!-- Dynamic Library Items Injected Here -->
                </div>

                <div id="visitor-library-footer" class="mt-2 pt-4 border-t border-white/5 text-center hidden-el">
                    <button onclick="goToVisitorLibrary()" class="text-sm font-bold text-white bg-[#F47521] hover:bg-[#d96216] px-6 py-2.5 rounded-xl transition-all shadow-lg">
                        View Full Library
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Visitor/Owner Actions Backup -->
        <div class="flex md:hidden flex-col gap-2.5 mt-8">
            <div id="owner-actions-mobile" class="space-y-2.5 w-full hidden-el">
                <button onclick="toggleSettingsPanel()" class="w-full bg-white/5 hover:bg-white/10 text-white border border-white/10 px-5 py-3.5 rounded-xl text-sm font-bold transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-cog"></i> Adjust Profile Settings
                </button>
                <button onclick="handleLogout()" class="w-full bg-white/5 hover:bg-white/10 text-white border border-white/10 px-5 py-3.5 rounded-xl text-sm font-bold transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-sign-out-alt"></i> Logout Session
                </button>
            </div>
            <div id="visitor-actions-mobile" class="w-full hidden-el">
                <button onclick="navigateToChat()" class="w-full bg-[#F47521] hover:bg-[#d96216] text-white px-5 py-4 rounded-xl text-sm font-black tracking-wide transition-all flex items-center justify-center gap-2 shadow-xl">
                    <i class="fas fa-paper-plane"></i> Message User
                </button>
            </div>
        </div>

    </main>

    <!-- Bottom Nav Mount -->
    <div id="bottom-nav-mount"></div>
    <script src="bottomnav.js"></script>

    <!-- Scripts: Cropper.js & Firebase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, updateDoc, increment, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
        import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChgVcbDPzc6AMeoac1hCOx39YK_1mEKvU",
            authDomain: "blaze-x-db2f5.firebaseapp.com",
            projectId: "blaze-x-db2f5",
            storageBucket: "blaze-x-db2f5.firebasestorage.app",
            messagingSenderId: "770812306638",
            appId: "1:770812306638:web:eaf5ded647861f32c25c9f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let activeProfileUid = null; 
        let currentAuthenticatedUser = null; 
        let isOwnerMode = true; 
        let cachedProfileData = null;
        let cropperInstance = null;

        onAuthStateChanged(auth, async (user) => {
            currentAuthenticatedUser = user;
            const urlParams = new URLSearchParams(window.location.search);
            const targetQueryId = urlParams.get('id');

            if (user) {
                if (!targetQueryId || targetQueryId === user.uid) {
                    activeProfileUid = user.uid;
                    isOwnerMode = true;
                } else {
                    activeProfileUid = targetQueryId;
                    isOwnerMode = false;
                }
                await evaluateProfileViewStructure();
            } else {
                if (targetQueryId) {
                    activeProfileUid = targetQueryId;
                    isOwnerMode = false;
                    await evaluateProfileViewStructure();
                } else {
                    document.querySelector('main').innerHTML = `
                        <div class="flex flex-col items-center justify-center min-h-[50vh] text-center px-4">
                            <i class="fas fa-user-lock text-5xl text-[#F47521] mb-6"></i>
                            <h2 class="text-3xl font-black text-white mb-3">Authentication Required</h2>
                            <p class="text-gray-400 mb-8 max-w-md">You need to be logged into your account to view your private profile dashboard.</p>
                            <a href="index.html" class="bg-[#F47521] text-black px-8 py-3.5 rounded-xl font-black tracking-widest uppercase hover:bg-white transition-all shadow-lg">
                                Return to Home
                            </a>
                        </div>
                    `;
                }
            }
        });

        async function evaluateProfileViewStructure() {
            const badge = document.getElementById('view-badge');
            
            if (isOwnerMode) {
                badge.innerText = "Private View";
                badge.className = "bg-[#F47521]/20 text-[#F47521] px-2 py-0.5 rounded text-[10px] uppercase font-extrabold tracking-widest border border-[#F47521]/30";
                
                // Show Owner UI
                document.getElementById('owner-actions-desktop').classList.remove('hidden-el');
                document.getElementById('owner-actions-mobile').classList.remove('hidden-el');
                document.getElementById('upload-pfp-btn').classList.remove('hidden-el');
                document.getElementById('owner-dashboard').classList.remove('hidden-el');
                
                // Hide Visitor UI
                document.getElementById('visitor-actions-desktop').classList.add('hidden-el');
                document.getElementById('visitor-actions-mobile').classList.add('hidden-el');
                document.getElementById('visitor-dashboard').classList.add('hidden-el');
            } else {
                badge.innerText = "Public View";
                badge.className = "bg-white/10 text-gray-300 px-2 py-0.5 rounded text-[10px] uppercase font-extrabold tracking-widest border border-white/10";
                
                // Hide Owner UI
                document.getElementById('owner-actions-desktop').classList.add('hidden-el');
                document.getElementById('owner-actions-mobile').classList.add('hidden-el');
                document.getElementById('upload-pfp-btn').classList.add('hidden-el');
                document.getElementById('owner-dashboard').classList.add('hidden-el');
                
                // Show Visitor UI
                document.getElementById('visitor-actions-desktop').classList.remove('hidden-el');
                document.getElementById('visitor-actions-mobile').classList.remove('hidden-el');
                document.getElementById('visitor-dashboard').classList.remove('hidden-el');
            }

            document.getElementById('user-uid-display').innerText = `ID: ${activeProfileUid}`;
            await pullTargetProfilePayload();
        }

        async function pullTargetProfilePayload() {
            try {
                const userDocRef = doc(db, "users", activeProfileUid);
                const userDoc = await getDoc(userDocRef);
                
                if (userDoc.exists()) {
                    cachedProfileData = userDoc.data();
                    renderProfileHeader(cachedProfileData);
                } else {
                    cachedProfileData = { username: "Anime Fan", likesCount: 0, hideLibrary: false };
                    renderProfileHeader(cachedProfileData);
                }

                // If visitor, fetch their library for the slider
                if (!isOwnerMode) {
                    await fetchVisitorLibrarySlider();
                }

            } catch (error) {
                console.error("Critical Error: ", error);
            }
        }

        function renderProfileHeader(data) {
            document.getElementById('user-name').innerText = data.username || data.displayName || "Anime Fan";
            document.getElementById('user-email').innerText = isOwnerMode && currentAuthenticatedUser ? currentAuthenticatedUser.email : "";
            
            const pfpUrl = data.photoURL || "https://ui-avatars.com/api/?name=User&background=111&color=F47521";
            document.getElementById('user-avatar').src = pfpUrl;

            let countedLikes = 0;
            if (data.likedByArray) countedLikes = data.likedByArray.length;
            else if (data.likesCount) countedLikes = data.likesCount;
            
            document.getElementById('stat-likes-count').innerText = countedLikes;

            if (currentAuthenticatedUser && data.likedByArray && data.likedByArray.includes(currentAuthenticatedUser.uid)) {
                document.getElementById('heart-icon').className = "fas fa-heart text-[#F47521]";
            } else {
                document.getElementById('heart-icon').className = "far fa-heart text-gray-400";
            }

            if (isOwnerMode) {
                document.getElementById('input-edit-username').value = data.username || "";
                document.getElementById('toggle-hide-library').checked = data.hideLibrary || false;
            }
        }

        // ==========================
        // VISITOR LIBRARY SLIDER
        // ==========================
        async function fetchVisitorLibrarySlider() {
            const sliderMount = document.getElementById('visitor-library-slider');
            const statusText = document.getElementById('visitor-library-status');
            const footerBtn = document.getElementById('visitor-library-footer');

            if (cachedProfileData.hideLibrary === true) {
                statusText.innerHTML = `<span class="text-red-400"><i class="fas fa-lock mr-1"></i> Private</span>`;
                sliderMount.innerHTML = `<div class="w-full text-center py-6 text-gray-500 italic">This user has chosen to set their collection private.</div>`;
                footerBtn.classList.add('hidden-el');
                return;
            }

            try {
                const libRef = collection(db, "users", activeProfileUid, "library");
                const snapshot = await getDocs(libRef);
                
                statusText.innerHTML = `<span class="text-green-400"><i class="fas fa-globe mr-1"></i> Public (${snapshot.size})</span>`;

                if (snapshot.empty) {
                    sliderMount.innerHTML = `<div class="w-full text-center py-6 text-gray-600">User's library is empty.</div>`;
                    footerBtn.classList.add('hidden-el');
                    return;
                }

                let htmlPayload = "";
                // Limit to 10 for slider performance
                const docs = snapshot.docs.slice(0, 10); 
                
                docs.forEach((itemDoc) => {
                    const item = itemDoc.data();
                    const poster = item.poster || "https://via.placeholder.com/150x225/111/fff?text=No+Image";
                    htmlPayload += `
                        <div class="snap-center shrink-0 w-28 md:w-32 flex flex-col items-center group">
                            <div class="w-28 h-40 md:w-32 md:h-48 rounded-xl overflow-hidden mb-2 relative">
                                <img src="${poster}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                                <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                                <span class="absolute bottom-2 left-2 right-2 text-center text-[10px] uppercase font-bold text-white bg-[#F47521]/90 rounded px-1">${item.status || 'Watching'}</span>
                            </div>
                            <span class="text-xs font-bold text-gray-300 text-center line-clamp-2 w-full">${item.title || 'Untitled'}</span>
                        </div>
                    `;
                });
                
                sliderMount.innerHTML = htmlPayload;
                footerBtn.classList.remove('hidden-el');

            } catch (err) {
                sliderMount.innerHTML = `<div class="w-full text-center text-red-500 py-4">Error loading library.</div>`;
            }
        }

        window.goToVisitorLibrary = () => {
            window.location.href = `library.html?id=${activeProfileUid}`;
        };

        // ==========================
        // PROFILE PICTURE CROPPING
        // ==========================
        window.initiatePfpUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const imgElement = document.getElementById('image-to-crop');
                imgElement.src = e.target.result;
                
                document.getElementById('cropper-modal').classList.remove('hidden-el');
                
                if (cropperInstance) cropperInstance.destroy();
                cropperInstance = new Cropper(imgElement, {
                    aspectRatio: 1,
                    viewMode: 1,
                    dragMode: 'move',
                    autoCropArea: 1,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    guides: false,
                    highlight: false,
                    background: false,
                });
            };
            reader.readAsDataURL(file);
            event.target.value = ''; // reset input
        };

        window.closeCropper = () => {
            document.getElementById('cropper-modal').classList.add('hidden-el');
            if (cropperInstance) cropperInstance.destroy();
        };

        window.saveCroppedImage = async () => {
            if (!cropperInstance || !currentAuthenticatedUser) return;
            
            // Get cropped canvas as base64 string
            const canvas = cropperInstance.getCroppedCanvas({ width: 400, height: 400 });
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            
            closeCropper();
            document.getElementById('user-avatar').src = dataUrl; // Optimistic UI Update

            try {
                // Upload to Firebase Storage
                const storageRef = ref(storage, `avatars/${currentAuthenticatedUser.uid}.jpg`);
                await uploadString(storageRef, dataUrl, 'data_url');
                const downloadURL = await getDownloadURL(storageRef);
                
                // Save URL to User Document
                const userDocRef = doc(db, "users", currentAuthenticatedUser.uid);
                await updateDoc(userDocRef, { photoURL: downloadURL });
                
                alert("Profile picture updated successfully!");
            } catch (err) {
                console.error("Avatar Upload Error:", err);
                alert("Failed to upload image. Please check your storage rules/connection.");
            }
        };

        // ==========================
        // OTHER ACTIONS
        // ==========================
        window.handleProfileLike = async () => {
            if (!currentAuthenticatedUser) {
                alert("Please log in to like profiles.");
                return;
            }
            const userDocRef = doc(db, "users", activeProfileUid);
            const heartIcon = document.getElementById('heart-icon');
            
            try {
                if (cachedProfileData.likedByArray && cachedProfileData.likedByArray.includes(currentAuthenticatedUser.uid)) {
                    await updateDoc(userDocRef, {
                        likedByArray: arrayRemove(currentAuthenticatedUser.uid),
                        likesCount: increment(-1)
                    });
                    heartIcon.className = "far fa-heart text-gray-400";
                } else {
                    await updateDoc(userDocRef, {
                        likedByArray: arrayUnion(currentAuthenticatedUser.uid),
                        likesCount: increment(1)
                    });
                    heartIcon.className = "fas fa-heart text-[#F47521]";
                }
                await pullTargetProfilePayload();
            } catch (err) {
                console.error("Like Error: ", err);
            }
        };

        window.handleAvatarClick = () => {
            const modal = document.getElementById('fullscreen-avatar-modal');
            document.getElementById('modal-avatar-img').src = document.getElementById('user-avatar').src;
            modal.classList.remove('hidden-el');
            setTimeout(() => { modal.style.opacity = '1'; }, 10);
        };

        window.closeFullscreenAvatar = () => {
            const modal = document.getElementById('fullscreen-avatar-modal');
            modal.style.opacity = '0';
            setTimeout(() => { modal.classList.add('hidden-el'); }, 300);
        };

        window.navigateToChat = () => {
            if(!currentAuthenticatedUser) {
                alert("Please log in to send a message.");
                return;
            }
            // Navigate to chat.html with both IDs mapped
            window.location.href = `chat.html?userA=${currentAuthenticatedUser.uid}&userB=${activeProfileUid}`;
        };

        window.toggleSettingsPanel = () => {
            document.getElementById('owner-settings-panel').classList.toggle('hidden-el');
        };

        window.updateProfileMetadata = async () => {
            if (!isOwnerMode || !currentAuthenticatedUser) return;
            const newName = document.getElementById('input-edit-username').value.trim();
            if(!newName) return;

            try {
                const userDocRef = doc(db, "users", currentAuthenticatedUser.uid);
                await updateDoc(userDocRef, { username: newName });
                alert("Username updated successfully.");
                await pullTargetProfilePayload();
            } catch(e) {
                alert("Failed to update username.");
            }
        };

        window.handleLibraryVisibilityToggle = async () => {
            if (!isOwnerMode || !currentAuthenticatedUser) return;
            const checkedVal = document.getElementById('toggle-hide-library').checked;

            try {
                const userDocRef = doc(db, "users", currentAuthenticatedUser.uid);
                await updateDoc(userDocRef, { hideLibrary: checkedVal });
                cachedProfileData.hideLibrary = checkedVal;
                alert(`Library is now set to ${checkedVal ? 'Private' : 'Public'}.`);
            } catch(e) {
                alert("Failed to update privacy settings.");
            }
        };

        window.handleLogout = async () => {
            try {
                await signOut(auth);
                window.location.href = 'index.html'; 
            } catch (error) {
                alert("Error logging out.");
            }
        };
    </script>
</body>
</html>
