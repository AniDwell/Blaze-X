<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blaze-X</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #F47521; /* Blaze-X Orange */
            --bg-dark: #000000;
            --text-light: #ffffff;
        }

        html, body {
            height: 100%; width: 100%; margin: 0; padding: 0;
            background-color: var(--bg-dark); color: var(--text-light);
            overflow: hidden; font-family: 'Lato', sans-serif;
            -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
        }

        /* Scrollbar & Utility Classes */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Animations */
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* UI Elements */
        .glass-modal { background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .ani-input { background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; width: 100%; outline: none; }
        .ani-input:focus { border-color: var(--primary); }
        .blur-backdrop { filter: blur(20px) brightness(0.4); transform: scale(1.1); }
        img { user-drag: none; -webkit-user-drag: none; pointer-events: auto; }

        /* TikTok-Style Loader Engine */
        .tk-loader { position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        .tk-dot { position: absolute; width: 20px; height: 20px; border-radius: 50%; }
        .tk-dot-1 { background-color: var(--primary); animation: tk-move-1 0.8s infinite ease-in-out alternate; }
        .tk-dot-2 { background-color: #ffffff; animation: tk-move-2 0.8s infinite ease-in-out alternate; }
        
        @keyframes tk-move-1 {
            0% { transform: translateX(-15px) scale(1); z-index: 2; }
            100% { transform: translateX(15px) scale(0.8); z-index: 1; }
        }
        @keyframes tk-move-2 {
            0% { transform: translateX(15px) scale(0.8); z-index: 1; }
            100% { transform: translateX(-15px) scale(1); z-index: 2; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="boot-loader" class="fixed inset-0 flex flex-col items-center justify-center bg-black z-[100]">
        <div class="tk-loader">
            <div class="tk-dot tk-dot-1"></div>
            <div class="tk-dot tk-dot-2"></div>
        </div>
    </div>

    <!-- Modal Overlay used by Continue Watching & App functions -->
    <div id="modal-overlay" class="fixed inset-0 z-[70] hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity duration-300">
        <div id="modal-content" class="glass-modal w-full max-w-sm rounded-xl p-6 transform transition-all scale-95 opacity-0 shadow-2xl"></div>
    </div>

    <div id="app-container" class="hidden flex flex-col h-full w-full pt-[60px]">
        
        <div id="header-container" class="flex-none z-50 relative"></div>

        <main id="main-content" class="flex-1 overflow-y-auto relative hide-scrollbar bg-black pb-20">
            
            <div id="home-view" class="w-full flex flex-col gap-6 animate-fade-in pb-8">
                <!-- 1. Hero Carousel -->
                <div id="carousel-container"></div>
                
                <!-- 2. Continue Watching (History) -->
                <div id="history-container"></div>
                
                <!-- 3. Newest Releases (Recent) -->
                <div id="recent-container"></div>
                
                <!-- 4. Top 10 of the Year Slider -->
                <div id="top10-slider-container"></div> 
                
                <!-- 5. Upcoming Releases Slider -->
                <div id="upcoming-slider-container"></div>
                
                <!-- 6. Action Anime Slider -->
                <div id="action-slider-container"></div>
                
                <!-- 7. Anime News & Announcements Slider -->
                <div id="news-container"></div>

                <!-- 8. All Time Popular (Cinematic Wide Cards) -->
                <div id="popular-container"></div>

                <!-- 9. Release Schedule (Upcoming Episodes & Live Countdowns) -->
                <div id="newep-container"></div>

                <!-- 10. Dynamic Lazy-Loaded Genre Sliders -->
                <div id="genrebased-container"></div>
                
                <!-- 11. Extras -->
                <div id="top-rated-slider-container"></div>
                <div id="must-watch-slider-container"></div>
                <div id="movies-container"></div>
                <div id="series-container"></div>
                <div id="pill-slider-container" class="pl-4 mt-2"></div>
            </div>

            <div id="dynamic-view" class="hidden w-full"></div>
        </main>

        <div id="bottomnav-container" class="flex-none absolute bottom-0 w-full z-50"></div>
    </div>

    <script>
        window.app = {
            config: {
                anikotoBase: 'https://anikoto-api-xi.vercel.app', 
                megaPlayBase: 'https://megaplay.buzz/stream/s-2', 
                defaultAvatars: ["https://iili.io/fWydBMG.md.png", "https://iili.io/fWydqns.md.png"]
            },
            
            state: { 
                activeProfile: null, 
                currentView: 'home',
                carouselItems: [],
                carouselInterval: null
            },
            
            api: {
                fetch: async (endpoint) => {
                    try {
                        const target = `${window.app.config.anikotoBase}${endpoint}`;
                        const res = await fetch(target);
                        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                        return await res.json();
                    } catch (error) { 
                        console.error("Blaze-X Fetch Error:", error); 
                        return null; 
                    }
                }
            },
            
            components: {}, 
            
            init: () => {
                const savedUser = localStorage.getItem('blazex_user_profile');
                if (savedUser) {
                    try {
                        window.app.state.activeProfile = JSON.parse(savedUser);
                    } catch(e) {
                        console.log("Local storage fallback configuration activated.");
                    }
                }

                if (!window.app.components.header) {
                    setTimeout(window.app.init, 50);
                    return;
                }

                document.getElementById('boot-loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('boot-loader').style.display = 'none';
                    document.getElementById('app-container').classList.remove('hidden');
                    window.app.renderHome();
                }, 300);
            },

            renderHome: () => {
                document.getElementById('dynamic-view').classList.add('hidden');
                document.getElementById('home-view').classList.remove('hidden');
                window.app.state.currentView = 'home';

                // --- Bulletproof Safe Execution Runner ---
                const safeRun = (componentFn) => {
                    try {
                        if (typeof componentFn === 'function') componentFn();
                    } catch (err) {
                        console.error("Component initialization error caught:", err);
                    }
                };

                // --- Ordered Sliders & Component Initializers ---
                safeRun(window.app.components.header);
                safeRun(window.app.components.bottomnav);
                safeRun(window.app.components.carousel);
                safeRun(window.app.components.continueWatching);
                safeRun(window.app.components.recentSlider);
                safeRun(window.app.components.topTenSlider);
                safeRun(window.app.components.upcomingSlider);
                safeRun(window.app.components.actionSlider);
                safeRun(window.app.components.newsSlider);
                safeRun(window.app.components.popularSlider);
                safeRun(window.app.components.newEpSlider);
                safeRun(window.app.components.genreSliders);
                
                // --- Future Placeholders ---
                safeRun(window.app.components.topRatedSlider);
                safeRun(window.app.components.mustWatchSlider);
            }
        };
    </script>

    <!-- App System Scripts -->
    <script type="module" src="header.js"></script>
    <script src="auth.js"></script>
    <script src="bottomnav.js"></script>
    
    <!-- All Custom Slider Scripts (Loaded in Render Order) -->
    <script src="carousel.js"></script>
    <script src="continue_watching.js"></script>
    <script src="recent_slider.js"></script> 
    <script src="top10_slider.js"></script> 
    <script src="upcoming_slider.js"></script>
    <script src="action_slider.js"></script> 
    <script src="news_slider.js"></script>
    <script src="popular_slider.js"></script>
    <script src="newep_slider.js"></script>
    <script src="genre_sliders.js"></script>
    
    <!-- Application Boot Sequence -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.app.init();
        });
    </script>
</body>
</html>
