<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blaze-X</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #F47521; /* Blaze-X Orange */
            --bg-dark: #000000;
            --text-light: #ffffff;
        }

        html, body {
            height: 100%; width: 100%; margin: 0; padding: 0;
            background-color: var(--bg-dark); color: var(--text-light);
            overflow-x: hidden; font-family: 'Lato', sans-serif;
            -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
        }

        /* Scrollbar & Utility Classes */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Animations */
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* UI Elements */
        .glass-modal { background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .ani-input { background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; width: 100%; outline: none; }
        .ani-input:focus { border-color: var(--primary); }
        
        /* GLOBAL SAFE EDGE PADDING: Keeps external sliders away from the left edge */
        [id$="-track"], .genre-slider-track, .slider-track {
            padding-left: max(1.5rem, env(safe-area-inset-left)) !important;
            scroll-padding-left: max(1.5rem, env(safe-area-inset-left)) !important;
        }

        /* TikTok-Style Loader Engine */
        .tk-loader { position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        .tk-dot { position: absolute; width: 20px; height: 20px; border-radius: 50%; }
        .tk-dot-1 { background-color: var(--primary); animation: tk-move-1 0.8s infinite ease-in-out alternate; }
        .tk-dot-2 { background-color: #ffffff; animation: tk-move-2 0.8s infinite ease-in-out alternate; }
        
        @keyframes tk-move-1 {
            0% { transform: translateX(-15px) scale(1); z-index: 2; }
            100% { transform: translateX(15px) scale(0.8); z-index: 1; }
        }
        @keyframes tk-move-2 {
            0% { transform: translateX(15px) scale(0.8); z-index: 1; }
            100% { transform: translateX(-15px) scale(1); z-index: 2; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="boot-loader" class="fixed inset-0 flex flex-col items-center justify-center bg-black z-[100]">
        <div class="tk-loader">
            <div class="tk-dot tk-dot-1"></div>
            <div class="tk-dot tk-dot-2"></div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="fixed inset-0 z-[70] hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity duration-300">
        <div id="modal-content" class="glass-modal w-full max-w-sm rounded-xl p-6 transform transition-all scale-95 opacity-0 shadow-2xl"></div>
    </div>

    <div id="app-container" class="hidden flex flex-col h-full w-full pt-[60px]">
        
        <div id="header-container" class="flex-none z-50 relative"></div>

        <main id="main-content" class="flex-1 overflow-y-auto overflow-x-hidden relative hide-scrollbar bg-black pb-20">
            
            <div id="home-view" class="w-full flex flex-col gap-6 animate-fade-in pb-8">
                <!-- Sliders sequence -->
                <div id="carousel-container"></div>
                <div id="history-container"></div>
                <div id="recent-container"></div>
                <div id="top10-slider-container"></div> 
                <div id="upcoming-slider-container"></div>
                <div id="action-slider-container"></div>
                <div id="news-container"></div>
                <div id="popular-container"></div>
                <div id="newep-container"></div>
                <div id="genrebased-container"></div>
                
                <!-- Extras -->
                <div id="top-rated-slider-container"></div>
                <div id="must-watch-slider-container"></div>
                <div id="movies-container"></div>
                <div id="series-container"></div>
                <div id="pill-slider-container" class="pl-4 mt-2"></div>
            </div>

            <div id="dynamic-view" class="hidden w-full"></div>
        </main>

        <div id="bottomnav-container" class="flex-none absolute bottom-0 w-full z-50"></div>
    </div>

    <script>
        // ==========================================
        // 1. GLOBAL CRASH PREVENTION & API MANAGER
        // ==========================================
        
        // Suppress unhandled promise rejections so external JS failures don't white-screen the app
        window.addEventListener('unhandledrejection', (event) => {
            console.warn('[Blaze-X Guard] Suppressed external script rejection:', event.reason);
            event.preventDefault();
        });

        // Advanced Fetch Interceptor: Automatically handles AniList Rate Limits (429) across ALL scripts
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            let retries = 4;
            let delay = 1500; // Start with 1.5s delay
            
            while (retries > 0) {
                try {
                    const response = await originalFetch.apply(this, args);
                    // If AniList says "Too Many Requests", intercept it before the script crashes
                    if (response.status === 429) {
                        console.warn(`[Blaze-X Network] Rate limit hit. Retrying in ${delay/1000}s...`);
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 1.5; // Exponential backoff (1.5s -> 2.2s -> 3.3s)
                        retries--;
                        continue;
                    }
                    return response;
                } catch (error) {
                    // Network failure (offline, timeout)
                    if (retries <= 1) throw error;
                    console.warn(`[Blaze-X Network] Request failed. Retrying...`, error.message);
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 1.5;
                    retries--;
                }
            }
        };

        // ==========================================
        // 2. CORE APPLICATION STATE
        // ==========================================
        window.app = {
            config: {
                anikotoBase: 'https://anikoto-api-xi.vercel.app', 
                megaPlayBase: 'https://megaplay.buzz/stream/s-2', 
                defaultAvatars: ["https://iili.io/fWydBMG.md.png", "https://iili.io/fWydqns.md.png"]
            },
            state: { 
                activeProfile: null, 
                currentView: 'home',
                carouselItems: [],
                carouselInterval: null
            },
            api: {
                // Legacy fetch wrapper (now protected by the global interceptor above)
                fetch: async (endpoint) => {
                    try {
                        const res = await fetch(`${window.app.config.anikotoBase}${endpoint}`);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return await res.json();
                    } catch (error) { 
                        return null; 
                    }
                }
            },
            components: {}, 
            
            init: () => {
                const savedUser = localStorage.getItem('blazex_user_profile');
                if (savedUser) {
                    try { window.app.state.activeProfile = JSON.parse(savedUser); } 
                    catch(e) {}
                }

                if (!window.app.components.header) {
                    setTimeout(window.app.init, 100); // Retry boot if scripts haven't parsed yet
                    return;
                }

                document.getElementById('boot-loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('boot-loader').style.display = 'none';
                    document.getElementById('app-container').classList.remove('hidden');
                    window.app.renderHome();
                }, 300);
            },

            renderHome: () => {
                document.getElementById('dynamic-view').classList.add('hidden');
                document.getElementById('home-view').classList.remove('hidden');
                window.app.state.currentView = 'home';

                // ==========================================
                // 3. SELF-HEALING COMPONENT RUNNER
                // ==========================================
                // This wrapper attempts to run a slider. If the slider crashes, it waits and tries again up to 4 times.
                const safeRunAsync = async (componentFn, name, attempt = 1) => {
                    if (typeof componentFn !== 'function') return;
                    try {
                        await componentFn();
                    } catch (err) {
                        console.warn(`[Blaze-X Self-Heal] ${name} failed on attempt ${attempt}:`, err.message);
                        if (attempt < 4) {
                            const delay = Math.min(1500 * Math.pow(1.5, attempt), 8000); // Staggered retry
                            setTimeout(() => safeRunAsync(componentFn, name, attempt + 1), delay);
                        }
                    }
                };

                // --- Execute UI Components ---
                safeRunAsync(window.app.components.header, 'Header');
                safeRunAsync(window.app.components.bottomnav, 'BottomNav');
                
                // --- Execute Sliders Sequentially ---
                // Using a slight delay between initializations so the DOM doesn't freeze
                const sliders = [
                    { fn: window.app.components.carousel, name: 'Carousel' },
                    { fn: window.app.components.continueWatching, name: 'ContinueWatching' },
                    { fn: window.app.components.recentSlider, name: 'RecentSlider' },
                    { fn: window.app.components.topTenSlider, name: 'TopTenSlider' },
                    { fn: window.app.components.upcomingSlider, name: 'UpcomingSlider' },
                    { fn: window.app.components.actionSlider, name: 'ActionSlider' },
                    { fn: window.app.components.newsSlider, name: 'NewsSlider' },
                    { fn: window.app.components.popularSlider, name: 'PopularSlider' },
                    { fn: window.app.components.newEpSlider, name: 'NewEpSlider' },
                    { fn: window.app.components.genreSliders, name: 'GenreSliders' }
                ];

                sliders.forEach((slider, index) => {
                    setTimeout(() => {
                        safeRunAsync(slider.fn, slider.name);
                    }, index * 150); // Stagger each slider load by 150ms for buttery smooth performance
                });
            }
        };
    </script>

    <!-- Global Firebase & Notifications Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { initializeGlobalNotifications } from "./popup.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChgVcbDPzc6AMeoac1hCOx39YK_1mEKvU",
            authDomain: "blaze-x-db2f5.firebaseapp.com",
            projectId: "blaze-x-db2f5"
        };
        
        const app = initializeApp(firebaseConfig);
        initializeGlobalNotifications(app);
    </script>

    <!-- App System Scripts -->
    <script type="module" src="header.js"></script>
    <script src="auth.js"></script>
    <script src="bottomnav.js"></script>
    
    <!-- All Custom Slider Scripts (Loaded safely at the bottom) -->
    <script src="popup.js" type="module"></script>
    <script src="carousel.js"></script>
    <script src="continue_watching.js"></script>
    <script src="recent_slider.js"></script> 
    <script src="top10_slider.js"></script> 
    <script src="upcoming_slider.js"></script>
    <script src="action_slider.js"></script> 
    <script src="news_slider.js"></script>
    <script src="popular_slider.js"></script>
    <script src="newep_slider.js"></script>
    <script src="genre_sliders.js"></script>
    
    <!-- Application Boot Sequence -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.app.init();
        });
    </script>
</body>
</html>
